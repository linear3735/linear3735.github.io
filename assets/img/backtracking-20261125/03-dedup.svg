<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img">
  <rect width="1120" height="470" fill="#ffffff"/>
  <text x="20" y="32" font-size="16" fill="#252b33" text-anchor="start" font-weight="400">去重判据问的是「同一层」,不是「同一条路径」</text>
  <rect x="20" y="52" width="520" height="356" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="82" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">同一层:值相同的兄弟只留第一个</text>
  <rect x="242.0" y="115.0" width="76" height="30" rx="8" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="280.0" y="134.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">[]</text>
  <line x1="280.0" y1="145.0" x2="170.0" y2="200.0" stroke="#e7eaf0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="132.0" y="200.0" width="76" height="30" rx="8" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="170.0" y="219.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <line x1="280.0" y1="145.0" x2="280.0" y2="200.0" stroke="#e7eaf0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="242.0" y="200.0" width="76" height="30" rx="8" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="280.0" y="219.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <line x1="280.0" y1="145.0" x2="390.0" y2="200.0" stroke="#e7eaf0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="352.0" y="200.0" width="76" height="30" rx="8" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="390.0" y="219.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <line x1="280" y1="149.0" x2="280" y2="198.0" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="272" y="244" font-size="12" fill="#c0392b" text-anchor="end" font-weight="400">跳过</text>
  <text x="40" y="268" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">nums[i] == nums[i-1] 且 nums[i-1] 不在路径上</text>
  <text x="40" y="298" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">=&gt; i-1 已作为兄弟分支走完,i 长出的子树和它同构</text>
  <text x="40" y="328" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">前提:先排序,相同的值才会挨在一起</text>
  <text x="40" y="358" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">代价:整棵同构子树都不会被展开</text>
  <rect x="580" y="52" width="520" height="356" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="600" y="82" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">同一条路径:两个 1 都要用上</text>
  <rect x="802.0" y="115.0" width="76" height="30" rx="8" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="840.0" y="134.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">[]</text>
  <rect x="712.0" y="190.0" width="76" height="30" rx="8" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="750.0" y="209.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="892.0" y="190.0" width="76" height="30" rx="8" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="930.0" y="209.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <line x1="840.0" y1="145.0" x2="750.0" y2="190.0" stroke="#e7eaf0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="840.0" y1="145.0" x2="930.0" y2="190.0" stroke="#e7eaf0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="712.0" y="260.0" width="76" height="30" rx="8" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="750.0" y="279.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <line x1="750.0" y1="220.0" x2="750.0" y2="260.0" stroke="#e7eaf0" stroke-width="1.5" stroke-linecap="round"/>
  <text x="800.0" y="280" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">路径 [1,1] 合法</text>
  <text x="600" y="330" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">used[i-1] == true:前一个 1 就在当前路径上,</text>
  <text x="600" y="354" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">说明它是「更深处」而不是「兄弟」,不能跳过</text>
  <text x="600" y="378" font-size="12" fill="#c0392b" text-anchor="start" font-weight="400">漏写 not =&gt; 合法排列被误杀,结果少解</text>
</svg>
