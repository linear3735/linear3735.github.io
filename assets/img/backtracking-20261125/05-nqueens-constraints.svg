  <text x="319.0" y="412.0" font-size="15" fill="#252b33" text-anchor="start" font-weight="400">2</text>
  <rect x="356.0" y="372.0" width="74.0" height="46" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.0"/>
