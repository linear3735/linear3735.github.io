  <text x="171.0" y="412.0" font-size="15" fill="#252b33" text-anchor="start" font-weight="400">0</text>
  <rect x="208.0" y="372.0" width="74.0" height="46" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.0"/>
  <text x="245.0" y="393.0" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">n=3</text>
  <text x="245.0" y="412.0" font-size="15" fill="#252b33" text-anchor="start" font-weight="400">0</text>
