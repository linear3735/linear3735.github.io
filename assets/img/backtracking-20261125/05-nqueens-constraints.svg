  <text x="615.0" y="412.0" font-size="15" fill="#252b33" text-anchor="start" font-weight="400">92</text>
  <text x="60.0" y="446.0" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">n=2、3 是 0:n=2 时两个皇后必然同列或同对角线;三个判据都是 O(1),每层最多枚举 n 列</text>
  <text x="60.0" y="470.0" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">n=9、10 分别是 352、724(正文 6.1 的表,门禁用同一份全排列暴力逐项核对)</text>
