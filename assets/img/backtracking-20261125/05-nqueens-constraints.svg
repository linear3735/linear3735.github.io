  <text x="384.0" y="210" font-size="14" fill="#252b33" text-anchor="start" font-weight="400">左下—右上对角线:row + col in diag1</text>
  <text x="384.0" y="234" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">从左下到右上的一条线上,row + col 是常数</text>
  <text x="1064.0" y="226" font-size="13" fill="#252b33" text-anchor="end" font-weight="400">diag1</text>
  <rect x="320.0" y="268" width="760.0" height="70" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <rect x="336.0" y="286" width="34" height="34" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.0"/>
  <text x="384.0" y="296" font-size="14" fill="#252b33" text-anchor="start" font-weight="400">左上—右下对角线:row - col in diag2</text>
  <text x="384.0" y="320" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">从左上到右下的一条线上,row - col 是常数</text>
  <text x="1064.0" y="312" font-size="13" fill="#252b33" text-anchor="end" font-weight="400">diag2</text>
  <text x="60.0" y="360.0" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">解的个数(本脚本实测,与力扣 51/52 的计数一致):</text>
