  <text x="60.0" y="338.0" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">一个解:(1,3,0,2)——每行恰好一个皇后</text>
  <rect x="320.0" y="96" width="760.0" height="70" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <rect x="336.0" y="114" width="34" height="34" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.0"/>
  <text x="384.0" y="124" font-size="14" fill="#252b33" text-anchor="start" font-weight="400">列:col in cols</text>
  <text x="384.0" y="148" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">同一列只能有一个皇后:进这一列之前先查 col</text>
  <text x="1064.0" y="140" font-size="13" fill="#252b33" text-anchor="end" font-weight="400">cols</text>
