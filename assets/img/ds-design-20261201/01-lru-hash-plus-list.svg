  <text x="184" y="208" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">最久未使用 ← 淘汰这头</text>
  <text x="676" y="208" font-size="12" fill="#2f7d6d" text-anchor="end" font-weight="400">→ 最近使用:新访问挂这头</text>
  <rect x="36" y="286" width="788" height="120" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="56" y="312" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">哈希表:key → 节点</text>
  <rect x="56" y="330" width="240" height="44" rx="6" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="176.0" y="356.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">key 1 → node</text>
  <rect x="316" y="330" width="240" height="44" rx="6" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="436.0" y="356.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">key 2 → node</text>
  <rect x="576" y="330" width="240" height="44" rx="6" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="696.0" y="356.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">key 3 → node</text>
  <text x="430" y="440" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">get 命中:哈希表 O(1) 找到节点 → 摘下来 → 挂到 tail 那端。两件事都由 O(1) 完成</text>
</svg>
