  <rect x="490" y="118" width="84" height="64" rx="6" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="532.0" y="147.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">key 3</text>
  <text x="532.0" y="164.0" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">节点</text>
  <rect x="592" y="118" width="84" height="64" rx="6" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="634.0" y="147.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">tail</text>
  <text x="634.0" y="164.0" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">哨兵</text>
