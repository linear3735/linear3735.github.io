<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">删除 O(1):把末尾元素换进空洞,再砍掉末尾</text>
  <text x="60" y="74" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">remove(7) 之前:vals 稠密,idx 记着每个值的下标</text>
  <rect x="60" y="92" width="96" height="54" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="108.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="160" y="92" width="96" height="54" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="208.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <rect x="260" y="92" width="96" height="54" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="308.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="360" y="92" width="96" height="54" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="408.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <text x="108" y="170" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <text x="208" y="170" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <text x="308" y="170" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <text x="408" y="170" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">3</text>
  <text x="60" y="170" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">下标</text>
  <text x="60" y="208" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">idx = { 3→0,  7→1,  1→2,  9→3 }    要删 7,它在 i = 1</text>
  <line x1="430" y1="224" x2="430.00" y2="250.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="430.00,258.00 425.40,250.00 434.60,250.00" fill="#3568a3"/>
  <text x="60" y="288" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">remove(7) 之后:把末尾的 9 搬到 i = 1,再 pop 掉末尾</text>
  <rect x="60" y="306" width="96" height="54" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="108.0" y="338.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="160" y="306" width="96" height="54" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="208.0" y="338.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <rect x="260" y="306" width="96" height="54" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="308.0" y="338.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="108" y="384" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <text x="208" y="384" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <text x="308" y="384" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <text x="60" y="384" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">下标</text>
  <text x="460" y="330" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">idx = { 3→0,  9→1,  1→2 }</text>
  <text x="460" y="362" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">只碰 i 和末尾两个位置,与 n 无关</text>
</svg>
