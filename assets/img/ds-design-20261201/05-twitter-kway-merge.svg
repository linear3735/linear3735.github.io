  <text x="430" y="392" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">堆里始终只有「每条链当前最新的那一个」;取走一个,就把它所属的链往回退一格补上</text>
  <text x="430" y="424" font-size="13" fill="#2f7d6d" text-anchor="middle" font-weight="400">所以最多碰 k + 10 个元素 —— 与「关注的人一共发过多少条」完全无关</text>
  <text x="430" y="452" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="400">漏掉「往回退一格」这步不会报错:信息流会退化成每个关注对象只剩最新一条</text>
