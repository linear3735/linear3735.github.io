  <rect x="612" y="104" width="156" height="50" rx="6" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="690.0" y="134.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">t7</text>
