  <text x="46" y="330" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">A 是整个左上角矩形,B 和 C 各切掉一条边 —— 左上角那一块被切了两次,所以 D 要加回来一次。</text>
  <text x="46" y="358" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">每多一个维度,项数翻一倍(2 的 d 次方)：一维两项,二维四项,三维八项,符号是越界次数的奇偶。</text>
  <text x="46" y="386" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">最容易写错的是那三项的下标:是 preSum[row1][col2+1] 和 preSum[row2+1][col1],用 row1,不是 row1-1。</text>
