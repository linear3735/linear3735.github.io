<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">区间和 = 两次相减：公共前缀自己消掉</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">要 nums[1..4] 的和：preSum[5] - preSum[1] = -2 - (-2) = 0</text>
  <text x="160" y="98" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">0</text>
  <rect x="100" y="110" width="120" height="50" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="160.0" y="141.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-2</text>
  <text x="280" y="98" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">1</text>
  <rect x="220" y="110" width="120" height="50" rx="0" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="280.0" y="141.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="400" y="98" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">2</text>
  <rect x="340" y="110" width="120" height="50" rx="0" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="400.0" y="141.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="520" y="98" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">3</text>
  <rect x="460" y="110" width="120" height="50" rx="0" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="520.0" y="141.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-5</text>
  <text x="640" y="98" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">4</text>
  <rect x="580" y="110" width="120" height="50" rx="0" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="640.0" y="141.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="760" y="98" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">5</text>
  <rect x="700" y="110" width="120" height="50" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="760.0" y="141.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-1</text>
  <rect x="100" y="190" width="600" height="36" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.3"/>
  <text x="400" y="213" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">preSum[5]：前 5 个元素的和 = -2</text>
  <rect x="100" y="240" width="120" height="36" rx="6" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.3"/>
  <text x="232" y="263" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">- preSum[1]：前 1 个元素的和 = -2（公共前缀）</text>
  <rect x="220" y="290" width="480" height="36" rx="6" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.3"/>
  <text x="460" y="313" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">剩下的正好是 nums[1..4] 的和 = 0</text>
  <line x1="100" y1="162" x2="100" y2="190" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
  <line x1="700" y1="162" x2="700" y2="190" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
  <line x1="220" y1="276" x2="220" y2="290" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
  <line x1="700" y1="226" x2="700" y2="290" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
  <rect x="30" y="348" width="940" height="82" rx="9" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1"/>
  <text x="46" y="378" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">两项相减,公共部分被精确消掉,所以查询是 O(1):不看区间有多长,永远只有一次减法。</text>
  <text x="46" y="406" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">换个说法：preSum[r+1] 是「前 r+1 个」的和,preSum[l] 是「前 l 个」的和,差的正是第 l+1 到第 r+1 个。</text>
</svg>
