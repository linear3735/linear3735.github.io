<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">对偶：两个算子互为逆运算，便宜的正好错开</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">nums 是 diff 的前缀和，diff 是 nums 的差分；S(D(x)) = x 且 D(S(x)) = x</text>
  <rect x="120" y="116" width="240" height="84" rx="6" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="240.0" y="155.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">nums</text>
  <text x="240.0" y="172.0" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">原数组</text>
  <rect x="640" y="116" width="240" height="84" rx="6" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="760.0" y="155.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">diff</text>
  <text x="760.0" y="172.0" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">差分数组</text>
  <line x1="372" y1="140" x2="620.00" y2="140.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="628.00,140.00 620.00,144.60 620.00,135.40" fill="#3568a3"/>
  <text x="500" y="108" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">D：相邻相减</text>
  <text x="500" y="126" font-size="11.5" fill="#3568a3" text-anchor="start" font-weight="400">diff[i] = nums[i] - nums[i-1]</text>
  <line x1="628" y1="186" x2="380.00" y2="186.00" stroke="#2f7d6d" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="372.00,186.00 380.00,181.40 380.00,190.60" fill="#2f7d6d"/>
  <text x="500" y="210" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">S：逐项累加 nums[i] = nums[i-1] + diff[i]</text>
  <rect x="310" y="268" width="280" height="38" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="450.0" y="291.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">区间查询</text>
  <rect x="590" y="268" width="310" height="38" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="745.0" y="291.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">区间修改（整段加减）</text>
  <rect x="100" y="306" width="210" height="44" rx="0" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="205.0" y="332.5" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">前缀和 preSum</text>
  <rect x="310" y="306" width="280" height="44" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="450.0" y="332.5" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">O(1)：两次相减</text>
  <rect x="590" y="306" width="310" height="44" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="745.0" y="332.5" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">O(n)：改一个点后面全失效</text>
  <rect x="100" y="350" width="210" height="44" rx="0" fill="#e4f1ee" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="205.0" y="376.5" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">差分 diff</text>
  <rect x="310" y="350" width="280" height="44" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="450.0" y="376.5" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">O(n)：得先还原整个数组</text>
  <rect x="590" y="350" width="310" height="44" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="745.0" y="376.5" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">O(1)：两次单点修改</text>
  <text x="30" y="448" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">谁也做不到两全：前缀和把查询变便宜、把修改变贵，差分反过来；两个都要 O(1)，就得上线段树。</text>
</svg>
