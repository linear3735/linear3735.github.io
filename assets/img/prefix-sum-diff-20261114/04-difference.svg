<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">差分：一次区间加 = 两次单点修改</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">给 nums[1..3] 全部加 3：diff[1] += 3，diff[4] -= 3，其它一格不动</text>
  <text x="30" y="92" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">nums（修改前）</text>
  <text x="160" y="118" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">0</text>
  <rect x="100" y="130" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="160.0" y="160.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-2</text>
  <text x="280" y="118" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">1</text>
  <rect x="220" y="130" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="280.0" y="160.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="400" y="118" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">2</text>
  <rect x="340" y="130" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="400.0" y="160.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="520" y="118" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">3</text>
  <rect x="460" y="130" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="520.0" y="160.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-5</text>
  <text x="640" y="118" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">4</text>
  <rect x="580" y="130" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="640.0" y="160.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="760" y="118" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">5</text>
  <rect x="700" y="130" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="760.0" y="160.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-1</text>
  <text x="30" y="216" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">diff（只有两格变了）</text>
  <text x="280" y="216" font-size="14" fill="#b5762a" text-anchor="start" font-weight="400">+3</text>
  <text x="640" y="216" font-size="14" fill="#b5762a" text-anchor="start" font-weight="400">-3</text>
  <rect x="100" y="228" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="160.0" y="258.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-2</text>
  <rect x="220" y="228" width="120" height="48" rx="0" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="280.0" y="250.0" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="280.0" y="266.0" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">2 + 3</text>
  <rect x="340" y="228" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="400.0" y="258.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="460" y="228" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="520.0" y="258.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-8</text>
  <rect x="580" y="228" width="120" height="48" rx="0" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="640.0" y="250.0" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="640.0" y="266.0" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">7 - 3</text>
  <rect x="700" y="228" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="760.0" y="258.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-3</text>
  <text x="400" y="306" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">这两格一动,还原出来的 nums[1..3] 整段被抬高 3</text>
  <text x="30" y="348" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">nums（还原后）</text>
  <rect x="100" y="360" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="160.0" y="390.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-2</text>
  <rect x="220" y="360" width="120" height="48" rx="0" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="280.0" y="390.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="340" y="360" width="120" height="48" rx="0" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="400.0" y="390.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">6</text>
  <rect x="460" y="360" width="120" height="48" rx="0" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="520.0" y="390.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-2</text>
  <rect x="580" y="360" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="640.0" y="390.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="700" y="360" width="120" height="48" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="760.0" y="390.12" font-size="17" fill="#252b33" text-anchor="middle" font-weight="400">-1</text>
  <text x="30" y="442" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">还原就是前缀和 res[i] = res[i-1] + diff[i]：diff[1] 的 +3 会一路传下去,diff[4] 的 -3 正好把它收住。</text>
</svg>
