  <text x="401.0" y="64" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="400">swap(nums[i], nums[p2])</text>
  <text x="40" y="300" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">所以 p2 -= 1 之后 i 不能跟着加:实测加上 i += 1,500 组随机数组里 125 组排错。</text>
  <text x="40" y="330" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">循环条件是 i &lt;= p2 而不是 i &lt; p2:i 和 p2 撞上时那一格还要判一次,否则漏掉最后一个元素(实测 109 组排错)。</text>
