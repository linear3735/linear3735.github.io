  <text x="40" y="268" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">i 撞上 2:和 p2 交换。换进来的那一个(可能是 0 也可能是 2)落在 i 上,还没检查过。</text>
  <line x1="337.0" y1="88" x2="458.00" y2="88.00" stroke="#b5762a" stroke-width="1.5" stroke-linecap="round"/>
