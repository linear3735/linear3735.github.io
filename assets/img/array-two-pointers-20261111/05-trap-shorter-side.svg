<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
  <rect width="880" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="840" height="232" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="52" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">力扣 42 双指针的中间状态:lmax = 3 锁死了左侧水位</text>
  <rect x="110" y="136" width="132" height="78" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <rect x="110" y="188" width="132" height="26" rx="6" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="176" y="124" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="400">lmax = 3</text>
  <text x="176" y="201" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">height[left] = 1</text>
  <line x1="300" y1="162" x2="257.00" y2="162.00" stroke="#2f7d6d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="250.00,162.00 257.00,157.40 257.00,166.60" fill="#2f7d6d"/>
  <text x="312" y="154" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="400">这一格的水位 = min(lmax, rmax) = lmax = 3,已经确定</text>
  <rect x="650" y="84" width="132" height="130" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <rect x="650" y="162" width="132" height="52" rx="6" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="716" y="72" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="400">rmax = 5</text>
  <text x="716" y="201" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">height[right] = 2</text>
  <line x1="596" y1="123.0" x2="635.00" y2="123.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <polygon points="642.00,123.00 635.00,127.60 635.00,118.40" fill="#737c88"/>
  <text x="586" y="115.0" font-size="13" fill="#737c88" text-anchor="end" font-weight="400">rmax 更大,这一侧还得等</text>
  <text x="40" y="240" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">lmax &lt;= rmax 时,左侧水位只由 lmax 决定:右边再高,水也从左边流走。所以 left 这一格可以立刻结算,left += 1。</text>
  <rect x="20" y="264" width="840" height="116" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="296" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">这就是 §1.1 那条判据的又一次复用:「这一步凭什么能丢掉这一格」——答案仍然是 min(lmax, rmax) 由较矮的一侧锁死。</text>
  <text x="40" y="326" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">顺序不能反:先更新 lmax / rmax,再结算。挪到循环末尾,实测 [4,2,0,3,2,5] 算出 -1(正确 9),[0,1,0,2,1,0,1,3,2,1,2,1] 算出 5(正确 6)。</text>
  <text x="40" y="356" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">单调栈是同一道题的另一种视角:横向分层,每一层由「栈顶左边第一个更高」和「当前这个更高」夹出来。</text>
</svg>
