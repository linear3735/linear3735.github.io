  <text x="40" y="250" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">上三角用 for j in range(i + 1, n):每一对 (i, j) 只交换一次。写成 range(n) 会把每对交换两次 ——</text>
  <rect x="20" y="280" width="840" height="62" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="310" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">两次叠加等于没转置,但第二步的水平翻转照做,于是结果是左右镜像:实测 [[1, 2], [3, 4]] 会得到 [[2, 1], [4, 3]]。</text>
  <text x="40" y="336" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">这种错不报异常、矩阵也确实「变了」,所以一定要拿不对称的输入试。</text>
