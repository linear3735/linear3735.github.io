<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img">
  <rect width="1080" height="440" fill="#ffffff"/>
  <text x="44" y="36" font-size="16" fill="#252b33" text-anchor="start" font-weight="600">力扣 98:只和直接孩子比,会把这棵树判成合法</text>
  <rect x="30" y="56" width="490" height="320" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <line x1="265" y1="158" x2="170" y2="207" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="265" y1="158" x2="360" y2="207" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="360" y1="243" x2="310" y2="292" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="360" y1="243" x2="410" y2="292" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="265" cy="140" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="265" y="145" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">10</text>
  <circle cx="170" cy="225" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="170" y="230" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">5</text>
  <circle cx="360" cy="225" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="360" y="230" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">15</text>
  <circle cx="310" cy="310" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="310" y="315" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">6</text>
  <circle cx="410" cy="310" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="410" y="315" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">20</text>
  <text x="275" y="348" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">直接孩子两两比:5&lt;10、15&gt;10、6&lt;15、20&gt;15</text>
  <text x="275" y="374" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">四项全过 → 误判成合法 BST ✗</text>
  <rect x="560" y="56" width="490" height="320" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="600" y="100" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">每个节点真正要满足的区间</text>
  <text x="600" y="142" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">10 ← (−∞, +∞)   ✓</text>
  <text x="600" y="176" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">5 ← (−∞, 10)    ✓</text>
  <text x="600" y="210" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">15 ← (10, +∞)   ✓</text>
  <text x="600" y="244" font-size="13" fill="#b5762a" text-anchor="start" font-weight="600">6 ← (10, 15)    ✗  越界!</text>
  <text x="600" y="278" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">20 ← (15, +∞)   ✓</text>
  <text x="44" y="410" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">区间是「参数」,只能自顶向下传:往左走就把上界收紧成当前值,往右走就把下界收紧成当前值</text>
</svg>
