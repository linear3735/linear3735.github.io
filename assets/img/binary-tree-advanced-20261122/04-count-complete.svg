<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img">
  <rect width="1080" height="500" fill="#ffffff"/>
  <text x="44" y="36" font-size="16" fill="#252b33" text-anchor="start" font-weight="600">力扣 222:完全二叉树数节点,为什么能到 O(log²N)</text>
  <rect x="30" y="56" width="330" height="366" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="195" y="86" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">左右高度相等 → 整棵是满的</text>
  <rect x="375" y="56" width="330" height="366" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="540" y="86" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">高度差 1:左子树满</text>
  <rect x="720" y="56" width="330" height="366" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="885" y="86" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">高度差 1:右子树满</text>
  <line x1="195" y1="166" x2="145" y2="204" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="195" y1="166" x2="245" y2="204" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="145" y1="236" x2="120" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="145" y1="236" x2="170" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="245" y1="236" x2="220" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="245" y1="236" x2="270" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="195" cy="150" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="195" y="155" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="145" cy="220" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="145" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="245" cy="220" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="245" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="120" cy="290" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="120" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <circle cx="170" cy="290" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="170" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">5</text>
  <circle cx="220" cy="290" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="220" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">6</text>
  <circle cx="270" cy="290" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="270" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">7</text>
  <text x="195" y="360" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="600">2³ − 1 = 7</text>
  <text x="195" y="388" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">量两次高度就结束,O(h)</text>
  <line x1="540" y1="166" x2="490" y2="204" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="540" y1="166" x2="590" y2="204" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="490" y1="236" x2="465" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="490" y1="236" x2="515" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="590" y1="236" x2="565" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="540" cy="150" r="16" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="540" y="155" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="490" cy="220" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="490" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="590" cy="220" r="16" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="590" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="465" cy="290" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="465" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <circle cx="515" cy="290" r="16" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="515" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">5</text>
  <circle cx="565" cy="290" r="16" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="565" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">6</text>
  <text x="540" y="360" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="600">左子树满:2² − 1 = 3</text>
  <text x="540" y="388" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">1 + 3 + 递归数右子树</text>
  <line x1="885" y1="166" x2="835" y2="204" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="885" y1="166" x2="935" y2="204" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="835" y1="236" x2="810" y2="274" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="885" cy="150" r="16" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="885" y="155" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="835" cy="220" r="16" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="835" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="935" cy="220" r="16" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="935" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="810" cy="290" r="16" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="810" y="295" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <text x="885" y="360" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">右子树才是满的:1</text>
  <text x="885" y="388" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">左子树不满 → 递归左边</text>
  <rect x="30" y="438" width="1020" height="46" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="50" y="466" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">每次只往一侧深入,而量一次高度是 O(h) → 总代价 h + (h−1) + … + 1 = O(h²),又因 h = O(log N),所以是 O(log²N)</text>
</svg>
