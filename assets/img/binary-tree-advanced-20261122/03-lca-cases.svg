<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img">
  <rect width="1080" height="430" fill="#ffffff"/>
  <text x="44" y="36" font-size="16" fill="#252b33" text-anchor="start" font-weight="600">力扣 236:最近公共祖先的三种情形</text>
  <line x1="300" y1="114" x2="185" y2="158" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="300" y1="114" x2="415" y2="158" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="185" y1="194" x2="125" y2="238" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="185" y1="194" x2="245" y2="238" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="415" y1="194" x2="355" y2="238" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="415" y1="194" x2="475" y2="238" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="245" y1="274" x2="210" y2="318" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="245" y1="274" x2="280" y2="318" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="300" cy="96" r="18" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="300" y="101" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="185" cy="176" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="185" y="181" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">5</text>
  <circle cx="415" cy="176" r="18" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="415" y="181" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="125" cy="256" r="18" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="125" y="261" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">6</text>
  <circle cx="245" cy="256" r="18" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="245" y="261" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="355" cy="256" r="18" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="355" y="261" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="475" cy="256" r="18" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="475" y="261" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">8</text>
  <circle cx="210" cy="336" r="18" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="210" y="341" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">7</text>
  <circle cx="280" cy="336" r="18" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="280" y="341" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <text x="300" y="386" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">力扣 236 的样例树</text>
  <text x="560" y="96" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">查询 ①  p=5, q=1</text>
  <text x="560" y="124" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">分居 3 的左右两侧</text>
  <text x="560" y="150" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">→ 答案就是 3</text>
  <text x="560" y="206" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">查询 ②  p=5, q=4</text>
  <text x="560" y="234" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">两个都在 3 的左子树里</text>
  <text x="560" y="260" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">→ 答案在左子树的返回值里,即 5</text>
  <text x="560" y="316" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">查询 ③  p=3, q=5</text>
  <text x="560" y="344" font-size="13" fill="#737c88" text-anchor="start" font-weight="400">root 自己就是 p</text>
  <text x="560" y="370" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">→ 直接返回 root</text>
  <text x="44" y="414" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">后序位置最强:只有左右子树的返回值都拿到了,才知道 p、q 是同侧还是分居两侧</text>
</svg>
