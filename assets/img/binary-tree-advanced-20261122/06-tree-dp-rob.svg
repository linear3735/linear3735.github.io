<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img">
  <rect width="1080" height="460" fill="#ffffff"/>
  <text x="44" y="36" font-size="16" fill="#252b33" text-anchor="start" font-weight="600">力扣 337:每个节点返回 (不偷, 偷) 两个数</text>
  <line x1="330" y1="140" x2="215" y2="190" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="330" y1="140" x2="445" y2="190" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="215" y1="230" x2="290" y2="280" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="445" y1="230" x2="520" y2="280" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="330" cy="120" r="20" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="330" y="125" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="362" y="125" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="600">(6, 7)</text>
  <circle cx="215" cy="210" r="20" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="215" y="215" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <text x="247" y="215" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="600">(3, 2)</text>
  <circle cx="445" cy="210" r="20" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="445" y="215" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="477" y="215" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="600">(1, 3)</text>
  <circle cx="290" cy="300" r="20" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="290" y="305" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="322" y="305" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="600">(0, 3)</text>
  <circle cx="520" cy="300" r="20" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="520" y="305" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <text x="552" y="305" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="600">(0, 1)</text>
  <text x="330" y="372" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">力扣 337 样例:答案是 7(选 3、3、1 三个节点)</text>
  <text x="620" y="100" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">叶子:(不偷=0,偷=自己的值)</text>
  <text x="620" y="140" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">内部节点</text>
  <text x="620" y="168" font-size="13" fill="#3568a3" text-anchor="start" font-weight="400">偷 = val + 左.不偷 + 右.不偷</text>
  <text x="620" y="196" font-size="13" fill="#3568a3" text-anchor="start" font-weight="400">不偷 = max(左两值) + max(右两值)</text>
  <text x="620" y="240" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">根:(不偷=6, 偷=7)</text>
  <text x="620" y="268" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">7 = 3 + 3(左.不偷) + 1(右.不偷)</text>
  <text x="620" y="296" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">6 = max(3,2) + max(1,3)</text>
  <text x="44" y="424" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">一个返回值不够用时,就返回一个元组:子节点需要把「偷自己」和「不偷自己」两种答案都交给父节点</text>
</svg>
