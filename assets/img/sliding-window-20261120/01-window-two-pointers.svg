  <text x="284.0" y="148.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="284.0" y="190" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">3</text>
  <rect x="316" y="116" width="64" height="54" rx="0" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="348.0" y="148.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
