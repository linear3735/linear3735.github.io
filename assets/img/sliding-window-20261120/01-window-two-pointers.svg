<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img">
  <rect width="980" height="340" fill="#ffffff"/>
  <text x="36" y="40" font-size="17" fill="#252b33" text-anchor="start" font-weight="600">窗口 [left, right):右指针只往前扩,左指针只往前缩</text>
  <text x="36" y="66" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">两个指针都不回头,所以每个元素最多进窗口一次、出窗口一次</text>
