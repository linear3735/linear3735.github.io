  <text x="250" y="98" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">窗口内的元素:left ≤ i ≤ right−1</text>
  <line x1="520" y1="84" x2="712.00" y2="84.00" stroke="#2f7d6d" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="720.00,84.00 712.00,88.60 712.00,79.40" fill="#2f7d6d"/>
  <text x="770" y="88" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="600">right++ → 扩大</text>
  <line x1="720" y1="300" x2="528.00" y2="300.00" stroke="#b5762a" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="520.00,300.00 528.00,295.40 528.00,304.60" fill="#b5762a"/>
  <text x="770" y="304" font-size="13" fill="#b5762a" text-anchor="start" font-weight="600">left++ → 收缩</text>
  <text x="36" y="308" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">入窗:right 扫过的元素各一次  ·  出窗:left 扫过的元素各一次  →  合计 O(N)</text>
</svg>
