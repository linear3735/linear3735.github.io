<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img">
  <rect width="1180" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="1180" height="620" rx="0" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.4"/>
  <text x="590.0" y="46" font-size="20" fill="#252b33" text-anchor="middle" font-weight="600">一套骨架,四种结构:差别只在「下一个是谁」</text>
  <text x="590.0" y="74" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">起点 + next_of + 是否查环 —— 循环体完全一样</text>
  <rect x="48" y="120" width="262" height="150" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.6"/>
  <text x="179.0" y="158" font-size="19" fill="#3568a3" text-anchor="middle" font-weight="600">数组</text>
  <text x="179.0" y="194" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">next_of:</text>
  <text x="179.0" y="220" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">下标 + 1</text>
  <line x1="78" y1="238" x2="280" y2="238" stroke="#3568a3" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="179.0" y="258" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">不查环</text>
  <line x1="313" y1="195.0" x2="321.00" y2="195.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="329.00,195.00 321.00,199.60 321.00,190.40" fill="#737c88"/>
  <rect x="332" y="120" width="262" height="150" rx="6" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.6"/>
  <text x="463.0" y="158" font-size="19" fill="#2f7d6d" text-anchor="middle" font-weight="600">链表</text>
  <text x="463.0" y="194" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">next_of:</text>
  <text x="463.0" y="220" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">p.next</text>
  <line x1="362" y1="238" x2="564" y2="238" stroke="#2f7d6d" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="463.0" y="258" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">不需要(但可有环)</text>
  <line x1="597" y1="195.0" x2="605.00" y2="195.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="613.00,195.00 605.00,199.60 605.00,190.40" fill="#737c88"/>
  <rect x="616" y="120" width="262" height="150" rx="6" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.6"/>
  <text x="747.0" y="158" font-size="19" fill="#b5762a" text-anchor="middle" font-weight="600">二叉树</text>
  <text x="747.0" y="194" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">next_of:</text>
  <text x="747.0" y="220" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">left / right</text>
  <line x1="646" y1="238" x2="848" y2="238" stroke="#b5762a" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="747.0" y="258" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">不查环</text>
  <line x1="881" y1="195.0" x2="889.00" y2="195.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="897.00,195.00 889.00,199.60 889.00,190.40" fill="#737c88"/>
  <rect x="900" y="120" width="262" height="150" rx="6" fill="#eef1f5" stroke="#737c88" stroke-width="1.6"/>
  <text x="1031.0" y="158" font-size="19" fill="#737c88" text-anchor="middle" font-weight="600">图</text>
  <text x="1031.0" y="194" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">next_of:</text>
  <text x="1031.0" y="220" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">邻接表的每个邻居</text>
  <line x1="930" y1="238" x2="1132" y2="238" stroke="#737c88" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <text x="1031.0" y="258" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">必须</text>
  <rect x="48" y="316" width="1084" height="196" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="72" y="350" font-size="15" fill="#252b33" text-anchor="start" font-weight="600">同一个骨架</text>
  <text x="76" y="386" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">while stack:</text>
  <text x="76" y="407" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">    cur = stack.pop()</text>
  <text x="76" y="428" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">    if should_skip(cur): continue</text>
  <text x="76" y="449" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">    visit(cur)</text>
  <text x="76" y="470" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">    for nxt in next_of(cur):</text>
  <text x="76" y="491" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">        if nxt not in seen:</text>
  <text x="76" y="512" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">            seen.add(nxt); stack.append(nxt)</text>
  <text x="1104" y="464" font-size="13" fill="#b5762a" text-anchor="end" font-weight="600">seen.add 必须在「入栈前」</text>
  <text x="590.0" y="578" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">骨架的价值是理解层面的:知道它们同构,技巧才能跨结构迁移</text>
</svg>
