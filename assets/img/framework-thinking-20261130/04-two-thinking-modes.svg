<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img">
  <rect width="1120" height="540" fill="#ffffff"/>
  <rect x="0" y="0" width="1120" height="540" rx="0" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.4"/>
  <text x="560.0" y="44" font-size="20" fill="#252b33" text-anchor="middle" font-weight="600">同一棵树,两种思维模式</text>
  <line x1="560" y1="128" x2="470" y2="176" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="560" y1="128" x2="650" y2="176" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="470" y1="216" x2="424" y2="264" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="470" y1="216" x2="516" y2="264" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="650" y1="216" x2="650" y2="264" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="560" cy="108" r="21" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="560" y="113" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <circle cx="470" cy="196" r="21" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="470" y="201" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <circle cx="650" cy="196" r="21" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="650" y="201" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <circle cx="424" cy="284" r="21" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="424" y="289" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <circle cx="516" cy="284" r="21" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="516" y="289" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <circle cx="650" cy="284" r="21" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="650" y="289" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">6</text>
  <rect x="36" y="330" width="500" height="160" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="286" y="362" font-size="15" fill="#b5762a" text-anchor="middle" font-weight="600">① 遍历模式:在「位置」上做事</text>
  <text x="60" y="396" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">前序位置 → 拿到「从根下来的路径」</text>
  <text x="60" y="422" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">后序位置 → 拿到「子树算完的结果」</text>
  <text x="60" y="452" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">适合:路径和、深度、祖先、序列化</text>
  <text x="60" y="476" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">不关心函数返回什么,只关心在哪一步做事</text>
  <rect x="584" y="330" width="500" height="160" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="834" y="362" font-size="15" fill="#2f7d6d" text-anchor="middle" font-weight="600">② 分解模式:定义语义,然后信任它</text>
  <text x="608" y="396" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">max_depth(node) 返回「以它为根的深度」</text>
  <text x="608" y="422" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">不去追踪子树内部,只假设它算对了</text>
  <text x="608" y="452" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">适合:高度、直径、是否平衡、子树聚合</text>
  <text x="608" y="476" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">难点是「信任递归」,不是写不出循环</text>
</svg>
