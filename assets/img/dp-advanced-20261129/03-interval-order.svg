<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">区间 DP 的填表顺序:沿长度一层层往外</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">base case 在主对角线（长度 1），之后按区间长度 2、3、4 依次外推</text>
  <rect x="168" y="96" width="62" height="62" rx="5" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="199.0" y="131.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="240" y="168" width="62" height="62" rx="5" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="271.0" y="203.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="312" y="240" width="62" height="62" rx="5" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="343.0" y="275.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="384" y="312" width="62" height="62" rx="5" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="415.0" y="347.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="456" y="384" width="62" height="62" rx="5" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="487.0" y="419.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="528" y="456" width="62" height="62" rx="5" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="559.0" y="491.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="240" y="96" width="62" height="62" rx="5" fill="#e4f1ee" stroke="#252b33" stroke-width="1.2"/>
  <text x="271.0" y="131.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="312" y="168" width="62" height="62" rx="5" fill="#e4f1ee" stroke="#252b33" stroke-width="1.2"/>
  <text x="343.0" y="203.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="384" y="240" width="62" height="62" rx="5" fill="#e4f1ee" stroke="#252b33" stroke-width="1.2"/>
  <text x="415.0" y="275.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="456" y="312" width="62" height="62" rx="5" fill="#e4f1ee" stroke="#252b33" stroke-width="1.2"/>
  <text x="487.0" y="347.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="528" y="384" width="62" height="62" rx="5" fill="#e4f1ee" stroke="#252b33" stroke-width="1.2"/>
  <text x="559.0" y="419.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="312" y="96" width="62" height="62" rx="5" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="343.0" y="131.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="384" y="168" width="62" height="62" rx="5" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="415.0" y="203.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="456" y="240" width="62" height="62" rx="5" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="487.0" y="275.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="528" y="312" width="62" height="62" rx="5" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="559.0" y="347.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="384" y="96" width="62" height="62" rx="5" fill="#efe6f5" stroke="#252b33" stroke-width="1.2"/>
  <text x="415.0" y="131.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="456" y="168" width="62" height="62" rx="5" fill="#efe6f5" stroke="#252b33" stroke-width="1.2"/>
  <text x="487.0" y="203.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="528" y="240" width="62" height="62" rx="5" fill="#efe6f5" stroke="#252b33" stroke-width="1.2"/>
  <text x="559.0" y="275.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="456" y="96" width="62" height="62" rx="5" fill="#eef1f5" stroke="#252b33" stroke-width="1.2"/>
  <text x="487.0" y="131.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <rect x="528" y="168" width="62" height="62" rx="5" fill="#eef1f5" stroke="#252b33" stroke-width="1.2"/>
  <text x="559.0" y="203.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <rect x="528" y="96" width="62" height="62" rx="5" fill="#ffffff" stroke="#252b33" stroke-width="1.2"/>
  <text x="559.0" y="131.0" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">6</text>
  <text x="152" y="131.0" font-size="11.5" fill="#737c88" text-anchor="end" font-weight="400">i=0</text>
  <text x="152" y="203.0" font-size="11.5" fill="#737c88" text-anchor="end" font-weight="400">i=1</text>
  <text x="152" y="275.0" font-size="11.5" fill="#737c88" text-anchor="end" font-weight="400">i=2</text>
  <text x="152" y="347.0" font-size="11.5" fill="#737c88" text-anchor="end" font-weight="400">i=3</text>
  <text x="152" y="419.0" font-size="11.5" fill="#737c88" text-anchor="end" font-weight="400">i=4</text>
  <text x="152" y="491.0" font-size="11.5" fill="#737c88" text-anchor="end" font-weight="400">i=5</text>
  <text x="199.0" y="82" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">j=0</text>
  <text x="271.0" y="82" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">j=1</text>
  <text x="343.0" y="82" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">j=2</text>
  <text x="415.0" y="82" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">j=3</text>
  <text x="487.0" y="82" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">j=4</text>
  <text x="559.0" y="82" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">j=5</text>
  <text x="30" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">格子里的数字 = 区间长度：</text>
  <rect x="250" y="546" width="26" height="20" rx="4" fill="#e8eff7" stroke="#252b33" stroke-width="1"/>
  <text x="284" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">长度 1</text>
  <rect x="368" y="546" width="26" height="20" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1"/>
  <text x="402" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">长度 2</text>
  <rect x="486" y="546" width="26" height="20" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1"/>
  <text x="520" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">长度 3</text>
  <rect x="604" y="546" width="26" height="20" rx="4" fill="#efe6f5" stroke="#252b33" stroke-width="1"/>
  <text x="638" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">长度 4</text>
  <rect x="722" y="546" width="26" height="20" rx="4" fill="#eef1f5" stroke="#252b33" stroke-width="1"/>
  <text x="756" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">长度 5</text>
  <rect x="840" y="546" width="26" height="20" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1"/>
  <text x="874" y="562" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">长度 6</text>
  <text x="168" y="586" font-size="11.5" fill="#3568a3" text-anchor="start" font-weight="400">蓝色那一圈（长度 1）就是 base case：单个字符 / 单个元素的区间。</text>
  <text x="30" y="648" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">格子里写的是「区间长度」。算长度 L 时只用到长度 L-1 和 L-2 的结果，所以按 L 从小到大填，用到的格子必然已经算好。</text>
  <text x="30" y="674" font-size="11.5" fill="#b5762a" text-anchor="start" font-weight="400">反过来按 i 从小到大填（每行从左到右），长度大的区间会先被访问到，读到空值。</text>
</svg>
