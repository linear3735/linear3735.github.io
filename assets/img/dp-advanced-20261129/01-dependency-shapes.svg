<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img">
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">三种依赖形态,对应三种压缩手法</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">能不能压、压成几维，只看 dp[i][j] 到底依赖哪些格子</text>
  <rect x="30" y="88" width="300" height="106" rx="8" fill="#e8eff7" stroke="#252b33" stroke-width="1.3"/>
  <text x="180" y="128" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">只依赖本行更小下标</text>
  <text x="180" y="156" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">→ 一维就够，正序遍历</text>
  <text x="180" y="178" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">dp[j-1]  dp[j]</text>
  <rect x="30" y="216" width="300" height="106" rx="8" fill="#fdf0e3" stroke="#252b33" stroke-width="1.3"/>
  <text x="180" y="256" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">只依赖上一行</text>
  <text x="180" y="284" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">→ 一维就够，但要留住旧值</text>
  <text x="180" y="306" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">dp[i-1][j]  dp[i][j]</text>
  <rect x="30" y="344" width="300" height="106" rx="8" fill="#e4f1ee" stroke="#252b33" stroke-width="1.3"/>
  <text x="180" y="384" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">同时依赖上一行和本行</text>
  <text x="180" y="412" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">→ 一维不够，必须保留两行</text>
  <text x="180" y="434" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">dp[i-1][j]  dp[i][j-1]  dp[i][j]</text>
  <text x="430" y="202" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">「留住旧值」在代码里长这样：</text>
  <rect x="430" y="216" width="194" height="126" rx="6" fill="#ffffff" stroke="#e7eaf0" stroke-width="1"/>
  <rect x="430" y="216" width="58" height="58" rx="5" fill="#eef1f5" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="459.0" y="249.0" font-size="9.5" fill="#252b33" text-anchor="middle" font-weight="400">i-1, j-1</text>
  <rect x="498" y="216" width="58" height="58" rx="5" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <rect x="566" y="216" width="58" height="58" rx="5" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <rect x="430" y="284" width="58" height="58" rx="5" fill="#eef1f5" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="459.0" y="317.0" font-size="9.5" fill="#252b33" text-anchor="middle" font-weight="400">i-1, j</text>
  <rect x="498" y="284" width="58" height="58" rx="5" fill="#eef1f5" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="527.0" y="317.0" font-size="9.5" fill="#252b33" text-anchor="middle" font-weight="400">i, j</text>
  <rect x="566" y="284" width="58" height="58" rx="5" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="430" y="366" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">先存 pre = dp[j] 再覆写 dp[j]，</text>
  <text x="430" y="390" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">否则 dp[i-1][j] 会被本行新值顶掉。</text>
  <text x="30" y="480" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">判断顺序永远是：先写清 dp 的递推依赖哪几个格子，再决定维度怎么省——反过来一定出错。</text>
</svg>
