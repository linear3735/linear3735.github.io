<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="470" viewBox="0 0 1020 470" role="img">
  <rect width="1020" height="470" fill="#ffffff"/>
  <text x="510.0" y="36" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">最长有效括号:栈里存的是「配不上的下标」,它把字符串切成若干段</text>
  <rect x="30" y="58" width="960" height="366" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="60" y="80" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">i / 字符</text>
  <text x="250" y="80" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">栈(底 → 顶)</text>
  <text x="560" y="80" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">这一步</text>
  <text x="900" y="80" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">答案</text>
  <text x="60" y="122" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="600">i=0  ')'</text>
  <rect x="250" y="96" width="52" height="40" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="276.0" y="121.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="560" y="122" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">弹掉 -1,栈空 → 把 0 压回去当新分界</text>
  <text x="900" y="122" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">—</text>
  <text x="60" y="176" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="600">i=1  '('</text>
  <rect x="250" y="150" width="52" height="40" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="276.0" y="175.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="308" y="150" width="52" height="40" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="334.0" y="175.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="560" y="176" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">左括号,压入下标 1</text>
  <text x="900" y="176" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">—</text>
  <text x="60" y="230" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="600">i=2  ')'</text>
  <rect x="250" y="204" width="52" height="40" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="276.0" y="229.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="560" y="230" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">弹掉 1,栈顶 0 还在 → 2 - 0 = 2</text>
  <text x="900" y="230" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">2</text>
  <text x="60" y="284" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="600">i=3  '('</text>
  <rect x="250" y="258" width="52" height="40" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="276.0" y="283.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="308" y="258" width="52" height="40" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="334.0" y="283.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="560" y="284" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">左括号,压入下标 3</text>
  <text x="900" y="284" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">2</text>
  <text x="60" y="338" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="600">i=4  ')'</text>
  <rect x="250" y="312" width="52" height="40" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="276.0" y="337.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="560" y="338" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">弹掉 3,栈顶 0 还在 → 4 - 0 = 4</text>
  <text x="900" y="338" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">4</text>
  <text x="60" y="392" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="600">i=5  ')'</text>
  <rect x="250" y="366" width="52" height="40" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="276.0" y="391.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="560" y="392" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">弹掉 0,栈空 → 把 5 压回去当新分界</text>
  <text x="900" y="392" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">4</text>
  <text x="510.0" y="446" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">绿色 = 栈底的分界;相邻两个分界之间一定是一段有效括号,所以答案只在配对成功那一步更新</text>
</svg>
