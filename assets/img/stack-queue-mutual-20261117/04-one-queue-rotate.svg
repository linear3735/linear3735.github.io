<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img">
  <rect width="1040" height="350" fill="#ffffff"/>
  <text x="520.0" y="36" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">用一个队列实现栈:push(4) 时把前面的元素依次转到队尾</text>
  <text x="40" y="103" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">push(4) 之后</text>
  <line x1="170" y1="97.0" x2="205.00" y2="97.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="213.00,97.00 205.00,101.60 205.00,92.40" fill="#3568a3"/>
  <text x="120" y="70" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">队头</text>
  <rect x="220" y="76" width="90" height="42" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="265.0" y="102.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="310" y="76" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="355.0" y="102.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="400" y="76" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="445.0" y="102.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="490" y="76" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="535.0" y="102.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="606" y="103" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">队头还是 1</text>
  <text x="40" y="163" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">转 1 次</text>
  <line x1="170" y1="157.0" x2="205.00" y2="157.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="213.00,157.00 205.00,161.60 205.00,152.40" fill="#3568a3"/>
  <text x="120" y="130" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">队头</text>
  <rect x="220" y="136" width="90" height="42" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="265.0" y="162.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="310" y="136" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="355.0" y="162.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="400" y="136" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="445.0" y="162.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="490" y="136" width="90" height="42" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="535.0" y="162.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="606" y="163" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">1 出队又入队</text>
  <text x="40" y="223" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">转 2 次</text>
  <line x1="170" y1="217.0" x2="205.00" y2="217.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="213.00,217.00 205.00,221.60 205.00,212.40" fill="#3568a3"/>
  <text x="120" y="190" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">队头</text>
  <rect x="220" y="196" width="90" height="42" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="265.0" y="222.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="310" y="196" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="355.0" y="222.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="400" y="196" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="445.0" y="222.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="490" y="196" width="90" height="42" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="535.0" y="222.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="606" y="223" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">2 出队又入队</text>
  <text x="40" y="283" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">转 3 次</text>
  <line x1="170" y1="277.0" x2="205.00" y2="277.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="213.00,277.00 205.00,281.60 205.00,272.40" fill="#3568a3"/>
  <text x="120" y="250" font-size="10.5" fill="#737c88" text-anchor="middle" font-weight="400">队头</text>
  <rect x="220" y="256" width="90" height="42" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="265.0" y="282.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="310" y="256" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="355.0" y="282.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="400" y="256" width="90" height="42" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="445.0" y="282.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="490" y="256" width="90" height="42" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="535.0" y="282.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="606" y="283" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">队头变成 4 = 栈顶</text>
  <text x="520.0" y="328" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">转了 3 次 = 原来的元素个数 = push 之后的 size 减 1</text>
</svg>
