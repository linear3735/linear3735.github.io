<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" role="img">
  <rect width="940" height="410" fill="#ffffff"/>
  <rect x="20" y="40" width="420" height="350" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">四点有向环, 只有 3 跳能到</text>
  <line x1="120" y1="120" x2="330" y2="120" stroke="#e7eaf0" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="292.0" y1="120.0" x2="300.00" y2="120.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="308.00,120.00 300.00,124.60 300.00,115.40" fill="#3568a3"/>
  <text x="225.0" y="106.0" font-size="12.5" fill="#3568a3" text-anchor="middle" font-weight="600">4</text>
  <line x1="330" y1="120" x2="330" y2="280" stroke="#e7eaf0" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="330.0" y1="242.0" x2="330.00" y2="250.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="330.00,258.00 325.40,250.00 334.60,250.00" fill="#3568a3"/>
  <text x="346.0" y="200.0" font-size="12.5" fill="#3568a3" text-anchor="middle" font-weight="600">3</text>
  <line x1="330" y1="280" x2="120" y2="280" stroke="#e7eaf0" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="158.0" y1="280.0" x2="150.00" y2="280.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="142.00,280.00 150.00,275.40 150.00,284.60" fill="#3568a3"/>
  <text x="225.0" y="296.0" font-size="12.5" fill="#3568a3" text-anchor="middle" font-weight="600">4</text>
  <line x1="120" y1="280" x2="120" y2="120" stroke="#e7eaf0" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="120.0" y1="158.0" x2="120.00" y2="150.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="120.00,142.00 124.60,150.00 115.40,150.00" fill="#3568a3"/>
  <text x="104.0" y="200.0" font-size="12.5" fill="#3568a3" text-anchor="middle" font-weight="600">2</text>
  <circle cx="120" cy="120" r="22" fill="#fdf0e3" stroke="#252b33" stroke-width="1.6"/>
  <text x="120" y="125.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="330" cy="120" r="22" fill="#e4f1ee" stroke="#252b33" stroke-width="1.6"/>
  <text x="330" y="125.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="330" cy="280" r="22" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="330" y="285.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="120" cy="280" r="22" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="120" y="285.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="36" y="344" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">dist[1][0]: 1→2→3→0 = 3+4+2 = 9</text>
  <text x="36" y="368" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">3 跳, 所以要转 3 圈 k 才拼得出来</text>
  <rect x="460" y="40" width="460" height="350" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="472" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">把「允许谁当中转」写成一维阶段</text>
  <text x="476" y="104" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">f_k[i][j] = 只允许前 k 个点当中转时的距离</text>
  <text x="476" y="140" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">f_k[i][j] = min( f_{k-1}[i][j],</text>
  <text x="476" y="164" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">                 f_{k-1}[i][k] + f_{k-1}[k][j] )</text>
  <line x1="476" y1="184" x2="904" y2="184" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round"/>
  <text x="476" y="216" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">k 在最外层 → 每圈多允许一个中转点</text>
  <text x="476" y="244" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">答案 dist[1][0] = 9  ✓</text>
  <text x="476" y="288" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">k 挪到内层 → 同一圈里 i、j 先跑完,</text>
  <text x="476" y="312" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">3 跳路径永远拼不出来</text>
  <text x="476" y="340" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">答案 dist[1][0] = ∞  ✗</text>
  <text x="476" y="372" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">两版编译都能过, 只有大图上才露馅</text>
</svg>
