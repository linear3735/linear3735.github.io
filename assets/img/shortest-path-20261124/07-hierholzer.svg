<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img">
  <rect width="960" height="410" fill="#ffffff"/>
  <rect x="20" y="40" width="430" height="350" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">三角形 + 一条死胡同（6.3 的例子）</text>
  <line x1="120" y1="210" x2="250" y2="120" stroke="#2f7d6d" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="120" x2="250" y2="300" stroke="#2f7d6d" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="300" x2="120" y2="210" stroke="#2f7d6d" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="210" x2="370" y2="210" stroke="#b5762a" stroke-width="3" stroke-linecap="round"/>
  <text x="176" y="146" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">①</text>
  <text x="266" y="206" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">②</text>
  <text x="176" y="272" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">③</text>
  <text x="250" y="194" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">④</text>
  <circle cx="120" cy="210" r="22" fill="#e4f1ee" stroke="#252b33" stroke-width="1.6"/>
  <text x="120" y="215.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="250" cy="120" r="22" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="250" y="125.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="250" cy="300" r="22" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="250" y="305.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="370" cy="210" r="22" fill="#e4f1ee" stroke="#252b33" stroke-width="1.6"/>
  <text x="370" y="215.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="36" y="344" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">度数: 0 是 3、3 是 1（两个奇点）</text>
  <text x="36" y="368" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">⇒ 必须从 0 出发, 到 3 结束</text>
  <rect x="470" y="40" width="470" height="350" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="482" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">栈里有路就走, 没路就收尾</text>
  <text x="486" y="104" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">① 0→1  ② 1→2  ③ 2→0（边走边删）</text>
  <text x="486" y="132" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">④ 0 还有 0→3 没走 → 走到 3</text>
  <text x="486" y="160" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">3 没边了 → 后序记 3</text>
  <text x="486" y="188" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">回到 0, 边也用完 → 后序记 0</text>
  <text x="486" y="216" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">回到 2、1、0 → 依次记 2, 1, 0</text>
  <line x1="486" y1="238" x2="924" y2="238" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round"/>
  <text x="486" y="270" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">后序: [3, 0, 2, 1, 0]</text>
  <text x="486" y="300" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">反转: [0, 1, 2, 0, 3]  ← 欧拉路径</text>
  <text x="486" y="340" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">反转后相邻两项之间都是一条真实走过的边,</text>
  <text x="486" y="364" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">每条边只走一次; 走不完 ⇒ 返回 None</text>
</svg>
