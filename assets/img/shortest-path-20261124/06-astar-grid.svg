  <text x="312" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">三个实测（都在 verify_code.py 里复跑）</text>
  <text x="316" y="104" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">① h ≡ 0 → 与 1.4 的 dijkstra() 逐格相等  ✓</text>
  <text x="316" y="136" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">② h = 曼哈顿 → 答案不变, 扩展格子数变少  ✓</text>
  <text x="316" y="168" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">③ h = 3 × 曼哈顿（不可采纳）→ 答案错  ✗</text>
  <line x1="316" y1="188" x2="924" y2="188" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round"/>
  <text x="316" y="220" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">实测三的网格: 墙在 grid[3][1]、grid[4][3],</text>
  <text x="316" y="246" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">起点 (0,0), 终点 (4,4)</text>
  <text x="316" y="282" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">真实最短 = 8 步（一路向右到 (4,0), 再向下）</text>
  <text x="316" y="310" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">h = 3 × 曼哈顿 → 10 步 ✗（扩展 23 → 11）</text>
  <text x="316" y="348" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">原因: h 高估 ⇒ 终点出队时 f(终点) 已经不是最优</text>
  <text x="316" y="372" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">可采纳 = 永远不高估: h(n) ≤ 真实剩余距离</text>
</svg>
