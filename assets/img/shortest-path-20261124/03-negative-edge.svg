<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img">
  <rect width="960" height="400" fill="#ffffff"/>
  <rect x="20" y="40" width="300" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">原文的最小反例</text>
  <line x1="80" y1="190" x2="250" y2="120" stroke="#e7eaf0" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="214.86223225796078" y1="134.4684925996632" x2="222.26" y2="131.42" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="229.66,128.38 224.01,135.68 220.51,127.17" fill="#3568a3"/>
  <text x="152" y="140" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="600">3</text>
  <line x1="80" y1="190" x2="250" y2="260" stroke="#e7eaf0" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="214.86223225796078" y1="245.5315074003368" x2="222.26" y2="248.58" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="229.66,251.62 220.51,252.83 224.01,244.32" fill="#3568a3"/>
  <text x="150" y="244" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="600">4</text>
  <line x1="250" y1="260" x2="250" y2="120" stroke="#b5762a" stroke-width="3" stroke-linecap="round"/>
  <line x1="250.0" y1="158.0" x2="250.00" y2="150.00" stroke="#b5762a" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="250.00,142.00 254.60,150.00 245.40,150.00" fill="#b5762a"/>
  <text x="236" y="196" font-size="13" fill="#b5762a" text-anchor="end" font-weight="600">-10</text>
  <circle cx="80" cy="190" r="22" fill="#e4f1ee" stroke="#252b33" stroke-width="1.6"/>
  <text x="80" y="195.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">s</text>
  <circle cx="250" cy="120" r="22" fill="#fdf0e3" stroke="#252b33" stroke-width="1.6"/>
  <text x="250" y="125.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">a</text>
  <circle cx="250" cy="260" r="22" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="250" y="265.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">b</text>
  <text x="36" y="330" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">真实最短: a = -6</text>
  <text x="36" y="354" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">s → b → a = 4 + (-10)</text>
  <rect x="340" y="40" width="280" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="352" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">四个实现, 两个答案</text>
  <text x="356" y="110" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">朴素版（有 done）</text>
  <text x="596" y="110" font-size="13" fill="#b5762a" text-anchor="end" font-weight="600">3  ✗</text>
  <text x="356" y="148" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">堆版 + dst 提前退出</text>
  <text x="596" y="148" font-size="13" fill="#b5762a" text-anchor="end" font-weight="600">3  ✗</text>
  <line x1="356" y1="168" x2="604" y2="168" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round"/>
  <text x="356" y="200" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">堆版完整跑完</text>
  <text x="596" y="200" font-size="13" fill="#2f7d6d" text-anchor="end" font-weight="600">-6  ✓</text>
  <text x="356" y="238" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">Bellman-Ford</text>
  <text x="596" y="238" font-size="13" fill="#2f7d6d" text-anchor="end" font-weight="600">-6  ✓</text>
  <line x1="356" y1="258" x2="604" y2="258" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round"/>
  <text x="356" y="296" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">堆版那个 ✓ 是侥幸: 它没有</text>
  <text x="356" y="320" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">done 标记, 会重新入队收敛</text>
  <text x="356" y="356" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">多传一个 dst 就从对变成错</text>
  <rect x="640" y="40" width="300" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="652" y="66" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">Bellman-Ford 的轮次</text>
  <text x="656" y="110" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">初始        [0, ∞, ∞]</text>
  <text x="656" y="150" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="400">第 1 轮后    [0, -6, 4]</text>
  <text x="656" y="190" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">第 2 轮后    无改进 → 停</text>
  <text x="656" y="230" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">第 V 轮      无改进 → 无负环</text>
  <line x1="656" y1="254" x2="924" y2="254" stroke="#e7eaf0" stroke-width="1.2" stroke-linecap="round"/>
  <text x="656" y="292" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">原地更新让 s → b → a 在同一</text>
  <text x="656" y="316" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">轮里就串起来了（2.1）</text>
  <text x="656" y="352" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">[dist[s], dist[a], dist[b]]</text>
</svg>
