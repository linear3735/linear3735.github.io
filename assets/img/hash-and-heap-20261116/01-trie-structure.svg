  <rect x="28" y="468" width="844" height="106" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="48" y="494" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">省内存:HashMap 真的存了 "apple"、"app"、"appl" 三个字符串,占 12 个字符;</text>
  <text x="48" y="514" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="600">Trie 不重复存公共前缀,只需要 "apple" 这 5 个字符。</text>
  <text x="48" y="542" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">前缀查询:hasKeyWithPrefix("tha") 只需要沿 t → h → a 走通,不必枚举表里所有的键;</text>
  <text x="48" y="562" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="600">而 search("th") 必须是「走得通」且「isEnd」两条同时成立。</text>
