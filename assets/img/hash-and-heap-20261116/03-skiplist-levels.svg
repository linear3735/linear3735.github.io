  <text x="539.7777777777778" y="218.0" font-size="11.5" fill="#b5762a" text-anchor="start" font-weight="400">第 1 层:40 → 60,再往右是 80,往下掉</text>
  <text x="615.3333333333333" y="298.0" font-size="11.5" fill="#b5762a" text-anchor="start" font-weight="400">第 0 层:60 的下一个就是 70,命中</text>
  <rect x="28" y="380" width="844" height="120" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="48" y="406" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">抛硬币决定层数:P(层数 &gt;= h) = (1/2)^(h-1),所以第 h 层的期望节点数是 n / 2^(h-1)</text>
  <text x="48" y="426" font-size="12.5" fill="#2f7d6d" text-anchor="start" font-weight="600">—— 正好就是原文简化示例里「每上一层减半」的理想情况。</text>
  <text x="48" y="454" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">每层最多移动 2 次,一共 log n 层 =&gt; 期望 O(log n);</text>
  <text x="48" y="474" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="600">但这是期望而不是最坏:硬币全抛成反面时所有节点都在第 0 层,退化成 O(n)。</text>
