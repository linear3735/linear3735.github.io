<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="36" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">同一个 memo 数组,两种填法</text>
  <text x="600" y="60" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">自顶向下先递归到 f(2),再逐层返回;自底向上直接用循环从左往右填</text>
  <rect x="40" y="86" width="520" height="400" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="70" y="122" font-size="15" fill="#252b33" text-anchor="start" font-weight="600">自顶向下:带备忘录的递归</text>
  <text x="74" y="156" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">dp(5)  → memo[5] 未命中</text>
  <text x="74" y="184" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">dp(4)  → memo[4] 未命中</text>
  <text x="74" y="212" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">dp(3)  → memo[3] 未命中</text>
  <text x="74" y="240" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">dp(2)  → memo[2] 未命中</text>
  <text x="74" y="268" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">base case 返回 1</text>
  <text x="74" y="296" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">写回 memo[2] = 1</text>
  <text x="74" y="324" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">写回 memo[3] = 2</text>
  <text x="74" y="352" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">写回 memo[4] = 3</text>
  <text x="74" y="380" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">写回 memo[5] = 5</text>
  <rect x="74" y="430" width="112" height="40" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="130.0" y="454.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">memo[2]</text>
  <rect x="196" y="430" width="112" height="40" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="252.0" y="454.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">memo[3]</text>
  <rect x="318" y="430" width="112" height="40" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="374.0" y="454.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">memo[4]</text>
  <rect x="440" y="430" width="112" height="40" rx="6" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="496.0" y="454.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">memo[5]</text>
  <text x="310" y="424" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">填表顺序 →</text>
  <rect x="620" y="86" width="540" height="400" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="650" y="122" font-size="15" fill="#252b33" text-anchor="start" font-weight="600">自底向上:迭代填 DP 表</text>
  <rect x="660" y="170" width="82" height="56" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="701.0" y="203.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="701" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <rect x="742" y="170" width="82" height="56" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="783.0" y="203.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="783" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <rect x="824" y="170" width="82" height="56" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="865.0" y="203.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="865" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <rect x="906" y="170" width="82" height="56" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="947.0" y="203.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="947" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">3</text>
  <rect x="988" y="170" width="82" height="56" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="1029.0" y="203.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="1029" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">4</text>
  <rect x="1070" y="170" width="82" height="56" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="1111.0" y="203.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="1111" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">5</text>
  <text x="650" y="262" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">dp[0] = 0, dp[1] = 1          ← base case</text>
  <text x="650" y="294" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">for i in 2..n:</text>
  <text x="680" y="322" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">dp[i] = dp[i-1] + dp[i-2]</text>
  <text x="650" y="366" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">右边的格子只依赖左边两个格子</text>
  <text x="650" y="400" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">所以两个滚动变量就够,空间 O(1)</text>
  <line x1="660" y1="452" x2="1132.00" y2="452.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="1140.00,452.00 1132.00,456.60 1132.00,447.40" fill="#3568a3"/>
  <text x="900" y="444" font-size="11" fill="#3568a3" text-anchor="middle" font-weight="400">填表顺序</text>
</svg>
