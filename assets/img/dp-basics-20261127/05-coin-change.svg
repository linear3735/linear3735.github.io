  <rect x="96" y="462" width="1008" height="52" rx="8" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="600" y="495" font-size="14" fill="#2f7d6d" text-anchor="middle" font-weight="400">dp[6] = 2,dp[9] = 3,dp[10] = 2  → dp[11] = min(3, 4, 3) = 3</text>
  <text x="600" y="544" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">兜底规则:如果某个来源是「无解」,它不能参与 min,否则假的「无解 + 1」会顶掉真答案</text>
