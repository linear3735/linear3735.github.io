<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500.0" y="34" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">接雨水:同一副递减栈,弹出时结算「一层」水</text>
  <text x="500.0" y="58" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">height = [4, 2, 0, 3, 2, 5],一层一层加,总水量 9</text>
  <rect x="110" y="164" width="76" height="176" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="148.0" y="360" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">i=0</text>
  <text x="148.0" y="376" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">h=4</text>
  <rect x="206" y="252" width="76" height="88" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="244.0" y="360" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">i=1</text>
  <text x="244.0" y="376" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">h=2</text>
  <rect x="302" y="340" width="76" height="0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="340.0" y="360" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">i=2</text>
  <text x="340.0" y="376" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">h=0</text>
  <rect x="398" y="208" width="76" height="132" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="436.0" y="360" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">i=3</text>
  <text x="436.0" y="376" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">h=3</text>
  <rect x="494" y="252" width="76" height="88" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="532.0" y="360" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">i=4</text>
  <text x="532.0" y="376" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">h=2</text>
  <rect x="590" y="120" width="76" height="220" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="628.0" y="360" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">i=5</text>
  <text x="628.0" y="376" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">h=5</text>
  <rect x="304" y="252" width="72" height="88" rx="2" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.2" opacity="0.85"/>
  <text x="340.0" y="300.0" font-size="14" fill="#2f7d6d" text-anchor="middle" font-weight="600">①</text>
  <rect x="208" y="208" width="168" height="44" rx="2" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.2" opacity="0.85"/>
  <text x="292.0" y="234.0" font-size="14" fill="#2f7d6d" text-anchor="middle" font-weight="600">②</text>
  <rect x="496" y="208" width="72" height="44" rx="2" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.2" opacity="0.85"/>
  <text x="532.0" y="234.0" font-size="14" fill="#2f7d6d" text-anchor="middle" font-weight="600">③</text>
  <rect x="208" y="164" width="360" height="44" rx="2" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.2" opacity="0.85"/>
  <text x="388.0" y="190.0" font-size="14" fill="#2f7d6d" text-anchor="middle" font-weight="600">④</text>
  <text x="500.0" y="404" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">① 宽 1 × 深 2 = 2  ② 宽 2 × 深 1 = 2  ③ 宽 1 × 深 1 = 1  ④ 宽 4 × 深 1 = 4</text>
  <text x="500.0" y="426" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">每一层都很薄:底 = 被弹出的柱子,左壁 = 栈里下一个,右壁 = 新来的柱子;四层相加 = 9</text>
</svg>
