  <text x="40" y="328" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">栈里两个人都还没等到答案</text>
  <text x="385.0" y="182" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">栈(栈底→栈顶)</text>
