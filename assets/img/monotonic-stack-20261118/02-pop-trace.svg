  <polygon points="181.00,574.00 173.00,578.60 173.00,569.40" fill="#b5762a"/>
  <text x="40" y="592" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">4 一次弹两个:while 不是 if</text>
  <text x="40" y="608" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">res[2] = 4、res[0] = 4</text>
  <text x="385.0" y="488" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">栈(栈底→栈顶)</text>
  <rect x="354" y="504" width="62" height="26" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="385.0" y="521.32" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">3:4</text>
