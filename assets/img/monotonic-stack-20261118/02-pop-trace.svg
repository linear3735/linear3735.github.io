  <text x="528" y="592" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">3 &lt; 4,不弹;3 入栈</text>
  <text x="528" y="608" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">结束时栈里剩 3、4 → 它们是 -1</text>
  <text x="873.0" y="462" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">栈(栈底→栈顶)</text>
  <rect x="842" y="504" width="62" height="26" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="873.0" y="521.32" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">3:4</text>
