<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500.0" y="34" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">什么时候弹出:新元素把栈顶所有比它小的结算掉</text>
  <text x="500.0" y="58" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">nums = [2, 1, 2, 4, 3],求每个元素右边第一个更大的值</text>
