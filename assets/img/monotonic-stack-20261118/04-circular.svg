<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img">
  <rect width="1000" height="340" fill="#ffffff"/>
  <text x="500.0" y="34" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">环形数组:把数组看成翻倍,下标取模读回来</text>
  <text x="500.0" y="58" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">扫 2n 步,答案只写前 n 位;只有第一圈才入栈</text>
  <rect x="62" y="120" width="86" height="48" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="105.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="105.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 0</text>
  <rect x="148" y="120" width="86" height="48" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="191.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="191.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 1</text>
  <rect x="234" y="120" width="86" height="48" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="277.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="277.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 2</text>
  <rect x="320" y="120" width="86" height="48" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="363.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="363.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 3</text>
  <rect x="406" y="120" width="86" height="48" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="449.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="449.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 4</text>
  <rect x="492" y="120" width="86" height="48" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="535.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="535.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 5</text>
  <rect x="578" y="120" width="86" height="48" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="621.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="621.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 6</text>
  <rect x="664" y="120" width="86" height="48" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="707.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="707.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 7</text>
  <rect x="750" y="120" width="86" height="48" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="793.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="793.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 8</text>
  <rect x="836" y="120" width="86" height="48" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="879.0" y="149.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="879.0" y="184" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">i = 9</text>
  <line x1="66" y1="196" x2="488" y2="196" stroke="#3568a3" stroke-width="1.2" stroke-linecap="round"/>
  <text x="277.0" y="214" font-size="11" fill="#3568a3" text-anchor="middle" font-weight="400">第一圈:真身,要入栈</text>
  <line x1="496" y1="196" x2="918" y2="196" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <text x="707.0" y="214" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">副本:只负责送答案</text>
  <text x="621.0" y="84" font-size="11" fill="#b5762a" text-anchor="middle" font-weight="400">末尾的 3 绕出去,在副本里遇到 4:res[4] = 4</text>
  <line x1="449.0" y1="100" x2="785.00" y2="100.00" stroke="#b5762a" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="793.00,100.00 785.00,104.60 785.00,95.40" fill="#b5762a"/>
  <rect x="24" y="240" width="460" height="80" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="44" y="266" font-size="14" fill="#252b33" text-anchor="start" font-weight="600">idx = i % n</text>
  <text x="44" y="288" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">i = 5..9 读到的还是下标 0..4,</text>
  <text x="44" y="306" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">所以 res 只写前 n 位就够了</text>
  <rect x="510" y="240" width="466" height="80" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="530" y="266" font-size="14" fill="#252b33" text-anchor="start" font-weight="600">if i &lt; n: stack.append(idx)</text>
  <text x="530" y="288" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">第二圈只负责「送答案」,不再排队;</text>
  <text x="530" y="306" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">入栈 n 次、出栈至多 n 次,O(n) 的账才算得干净</text>
</svg>
