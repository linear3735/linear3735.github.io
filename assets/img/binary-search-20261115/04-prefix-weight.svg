  <text x="357.0" y="274" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">t = 5 均匀取自 [0, 10),落在下标 2 这一段</text>
  <text x="450.0" y="376" font-size="13.5" fill="#252b33" text-anchor="middle" font-weight="600">bisect_right(prefix, 5) - 1 = 3 - 1 = 2   =&gt;   返回下标 2</text>
  <text x="450.0" y="398" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">P(返回 i) = 区间长度 / total = w[i] / sum(w)</text>
