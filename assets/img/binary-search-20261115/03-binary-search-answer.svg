  <text x="779.0" y="121.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <text x="150.0" y="158" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">lo = 1</text>
  <text x="816.0" y="158" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">hi = 9 (开区间上界)</text>
  <text x="138" y="185" font-size="12" fill="#737c88" text-anchor="end" font-weight="400">feasible(x)</text>
  <rect x="150.0" y="168" width="74" height="26" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="187.0" y="186" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">false</text>
  <rect x="224.0" y="168" width="74" height="26" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="261.0" y="186" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">false</text>
  <rect x="298.0" y="168" width="74" height="26" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="335.0" y="186" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">false</text>
  <rect x="372.0" y="168" width="74" height="26" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="409.0" y="186" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">false</text>
