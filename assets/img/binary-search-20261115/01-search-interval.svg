<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450.0" y="32" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">同一个数组,两种搜索区间:差别只在 right 指向哪</text>
  <text x="138" y="110.0" font-size="13" fill="#3568a3" text-anchor="end" font-weight="600">两端都闭</text>
  <text x="138" y="129.0" font-size="11" fill="#737c88" text-anchor="end" font-weight="400">right = n - 1 = 5</text>
  <rect x="150.0" y="82" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="183.0" y="110.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="183.0" y="144" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <rect x="216.0" y="82" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="249.0" y="110.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="249.0" y="144" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <rect x="282.0" y="82" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="315.0" y="110.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="315.0" y="144" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <rect x="348.0" y="82" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="381.0" y="110.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <text x="381.0" y="144" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">3</text>
  <rect x="414.0" y="82" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="447.0" y="110.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <text x="447.0" y="144" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">4</text>
  <rect x="480.0" y="82" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="513.0" y="110.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">11</text>
  <text x="513.0" y="144" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">5</text>
  <line x1="150.0" y1="70" x2="546.0" y2="70" stroke="#3568a3" stroke-width="2" stroke-linecap="round"/>
  <line x1="150.0" y1="64" x2="150.0" y2="76" stroke="#3568a3" stroke-width="2" stroke-linecap="round"/>
  <line x1="546.0" y1="64" x2="546.0" y2="76" stroke="#3568a3" stroke-width="2" stroke-linecap="round"/>
  <text x="348.0" y="60" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">搜索区间 [left, right] = [0, 5],右端是元素 11 本身</text>
  <text x="560.0" y="110.0" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">right</text>
  <text x="138" y="264.0" font-size="13" fill="#2f7d6d" text-anchor="end" font-weight="600">左闭右开</text>
  <text x="138" y="283.0" font-size="11" fill="#737c88" text-anchor="end" font-weight="400">right = n = 6</text>
  <rect x="150.0" y="236" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="183.0" y="264.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="183.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <rect x="216.0" y="236" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="249.0" y="264.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="249.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <rect x="282.0" y="236" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="315.0" y="264.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="315.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <rect x="348.0" y="236" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="381.0" y="264.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <text x="381.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">3</text>
  <rect x="414.0" y="236" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="447.0" y="264.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <text x="447.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">4</text>
  <rect x="480.0" y="236" width="66" height="46" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="513.0" y="264.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">11</text>
  <text x="513.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">5</text>
  <rect x="546.0" y="236" width="66" height="46" rx="0" fill="#f3f5f7" stroke="#737c88" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="579.0" y="264.0" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">越界位</text>
  <text x="579.0" y="298" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">6</text>
  <line x1="150.0" y1="224" x2="546.0" y2="224" stroke="#2f7d6d" stroke-width="2" stroke-linecap="round"/>
  <line x1="150.0" y1="218" x2="150.0" y2="230" stroke="#2f7d6d" stroke-width="2" stroke-linecap="round"/>
  <line x1="546.0" y1="218" x2="546.0" y2="230" stroke="#2f7d6d" stroke-width="2" stroke-linecap="round"/>
  <text x="348.0" y="214" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">搜索区间 [left, right) = [0, 6),右端只是一个位置,不是元素</text>
  <text x="626.0" y="264.0" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">right</text>
  <rect x="28" y="330" width="844" height="50" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="48" y="361" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">区间为空的判据:闭区间是 left &gt; right,左闭右开是 left &gt;= right</text>
  <text x="560" y="361" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="600">→ while 条件只能跟着区间走</text>
</svg>
