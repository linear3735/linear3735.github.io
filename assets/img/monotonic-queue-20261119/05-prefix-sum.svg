<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500.0" y="34" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">862:nums = [2, -1, 2], K = 3,答案是 3</text>
  <text x="500.0" y="58" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">把「子数组的和」换成前缀和之差,再在左边找「还可能有用的」下标</text>
  <text x="130" y="92" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">nums</text>
  <rect x="104" y="100" width="74" height="44" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="141.0" y="127.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="186" y="100" width="74" height="44" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="223.0" y="127.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">-1</text>
  <rect x="268" y="100" width="74" height="44" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="305.0" y="127.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="141" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <text x="223" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <text x="305" y="160" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <text x="56" y="200" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">pre</text>
  <rect x="104" y="208" width="74" height="44" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="141.0" y="235.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="186" y="208" width="74" height="44" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="223.0" y="235.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="268" y="208" width="74" height="44" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="305.0" y="235.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="350" y="208" width="74" height="44" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="387.0" y="235.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="141" y="268" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">0</text>
  <text x="223" y="268" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">1</text>
  <text x="305" y="268" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">2</text>
  <text x="387" y="268" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">3</text>
  <text x="387" y="288" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">pre[j] = nums[0..j-1] 的和</text>
  <text x="250" y="324" font-size="13" fill="#2f7d6d" text-anchor="middle" font-weight="600">nums[0..2] 的和 = pre[3] - pre[0] = 3 &gt;= K</text>
  <rect x="470" y="80" width="488" height="84" rx="10" fill="#e4f1ee" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="714.0" y="110" font-size="13" fill="#2f7d6d" text-anchor="middle" font-weight="600">能结算谁:队头满足 pre[j] - pre[队头] &gt;= K</text>
  <text x="714.0" y="138" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">记下长度 j - 队头,然后把它弹掉</text>
  <rect x="470" y="172" width="488" height="84" rx="10" fill="#fdf0e3" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="714.0" y="202" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="600">能压扁谁:队尾的 pre &gt;= pre[j]</text>
  <text x="714.0" y="230" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">它更靠左、前缀和还更大,两条都吃亏</text>
  <rect x="470" y="264" width="488" height="84" rx="10" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="714.0" y="294" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">两个都不满足就入队,等后面的 j</text>
  <text x="714.0" y="322" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">队列里始终是 pre 递增的候选左端点</text>
  <rect x="42" y="356" width="916" height="96" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="170" y="380" font-size="12" fill="#252b33" text-anchor="middle" font-weight="600">j = 1 之后</text>
  <rect x="110.0" y="392" width="58" height="30" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="139.0" y="411.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="172.0" y="392" width="58" height="30" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="201.0" y="411.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="170" y="440" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">-</text>
  <text x="500" y="380" font-size="12" fill="#252b33" text-anchor="middle" font-weight="600">j = 2 之后</text>
  <rect x="440.0" y="392" width="58" height="30" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="469.0" y="411.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="502.0" y="392" width="58" height="30" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="531.0" y="411.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="500" y="440" font-size="11" fill="#b5762a" text-anchor="middle" font-weight="400">1 被压扁( pre 更大且更靠左 )</text>
  <text x="830" y="380" font-size="12" fill="#252b33" text-anchor="middle" font-weight="600">j = 3 之后</text>
  <rect x="770.0" y="392" width="58" height="30" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="799.0" y="411.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="832.0" y="392" width="58" height="30" rx="0" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="861.0" y="411.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="830" y="440" font-size="11" fill="#b5762a" text-anchor="middle" font-weight="400">0 被结算( best = 3 - 0 = 3 )</text>
</svg>
