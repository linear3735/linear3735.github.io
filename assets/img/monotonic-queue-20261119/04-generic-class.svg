<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500.0" y="34" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">通用实现:每一次 push,三副队列同时更新</text>
  <text x="500.0" y="58" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">push(3) push(1) push(4) pop() 之后的状态</text>
  <rect x="42" y="80" width="916" height="250" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="150" y="112" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">_data 保先进先出</text>
  <rect x="90" y="132" width="120" height="34" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="150.0" y="153.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">t=1, 1</text>
  <rect x="90" y="176" width="120" height="34" rx="0" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="150.0" y="197.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">t=2, 4</text>
  <text x="500" y="112" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">_max 候补最大值</text>
  <rect x="440" y="132" width="120" height="34" rx="0" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="500.0" y="153.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">t=2, 4</text>
  <text x="850" y="112" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">_min 候补最小值</text>
  <rect x="790" y="132" width="120" height="34" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="850.0" y="153.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">t=1, 1</text>
  <rect x="790" y="176" width="120" height="34" rx="0" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="850.0" y="197.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">t=2, 4</text>
  <text x="150" y="236" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">t=0 已经被 pop 走了</text>
  <text x="500" y="236" font-size="11" fill="#2f7d6d" text-anchor="middle" font-weight="400">队头就是 max()</text>
  <text x="850" y="236" font-size="11" fill="#b5762a" text-anchor="middle" font-weight="400">队头就是 min()</text>
  <line x1="190" y1="200" x2="432.00" y2="200.00" stroke="#737c88" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="440.00,200.00 432.00,204.60 432.00,195.40" fill="#737c88"/>
  <text x="315" y="182" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">pop() 出队的是 t=0</text>
  <text x="315" y="220" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">它不在 max/min 的队头,那两副队列不动</text>
  <line x1="560" y1="200" x2="768.00" y2="200.00" stroke="#737c88" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="776.00,200.00 768.00,204.60 768.00,195.40" fill="#737c88"/>
  <text x="500.0" y="300" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">size() = len(_data) = 2   ·   max() = 4   ·   min() = 1</text>
  <rect x="42" y="346" width="916" height="60" rx="10" fill="#eef1f5" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="500.0" y="370" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">push 均摊 O(1) · pop 均摊 O(1) · size / max / min 都是 O(1)</text>
  <text x="500.0" y="392" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">每个元素一生只入队一次、出队一次;队列空时不要调用 max / min</text>
</svg>
