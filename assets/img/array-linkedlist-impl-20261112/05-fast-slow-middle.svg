<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img">
  <rect width="1240" height="620" fill="#ffffff"/>
  <text x="620" y="46" font-size="21" fill="#252b33" text-anchor="middle" font-weight="700">快慢指针找中点:fast 的速度是 slow 的两倍</text>
  <text x="620" y="74" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">fast 走完 n 步时 slow 走了 n/2 步 —— 一趟遍历同时完成「走完」和「停在中点」</text>
  <rect x="190" y="210" width="92" height="50" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="236.0" y="240.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="282" y="210" width="92" height="50" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="328.0" y="240.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="374" y="210" width="92" height="50" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="420.0" y="240.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="466" y="210" width="92" height="50" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="512.0" y="240.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="558" y="210" width="92" height="50" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="604.0" y="240.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <rect x="650" y="210" width="92" height="50" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="696.0" y="240.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">6</text>
  <text x="190" y="168" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">偶数长度 n=6</text>
  <rect x="371.0" y="207" width="98" height="56" rx="6" fill="none" stroke="#2f7d6d" stroke-width="2.0"/>
  <text x="420.0" y="294" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">slow</text>
  <rect x="647.0" y="207" width="98" height="56" rx="6" fill="none" stroke="#3568a3" stroke-width="2.0"/>
  <text x="696.0" y="294" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="600">fast</text>
  <text x="620" y="342" font-size="12.5" fill="#252b33" text-anchor="middle" font-weight="400">fast 走到末尾(第 6 个节点),slow 停在第 3 个 —— 这是「第二个中点」</text>
  <rect x="40" y="400" width="560" height="180" rx="10" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.2"/>
  <text x="320" y="442" font-size="15" fill="#2f7d6d" text-anchor="middle" font-weight="600">取第二个中点</text>
  <text x="320" y="474" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">while fast and fast.next:</text>
  <text x="320" y="508" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">fast 落在最后一个节点时判到 fast.next 为空就停</text>
  <text x="320" y="534" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">适用于找环入口一类的题</text>
  <rect x="640" y="400" width="560" height="180" rx="10" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.2"/>
  <text x="920" y="442" font-size="15" fill="#b5762a" text-anchor="middle" font-weight="600">取第一个中点(判回文要用)</text>
  <text x="920" y="474" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">while fast.next and fast.next.next:</text>
  <text x="920" y="508" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">先多走一步,slow 才不会包含后半段的中点</text>
  <text x="920" y="534" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">两种中点的区别就在这里</text>
</svg>
