<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img">
  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="620" y="46" font-size="21" fill="#252b33" text-anchor="middle" font-weight="700">双链表的双哨兵:插入永远发生在「prev 和 next 之间」</text>
  <text x="620" y="74" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">双链表插入要改四个指针;双哨兵保证这两侧都一定非空</text>
  <text x="520" y="120" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">空链表也是两条哨兵互指,不是 null</text>
  <rect x="330" y="146" width="168" height="50" rx="5" fill="#eef1f5" stroke="#2f7d6d" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="414.0" y="176.0" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">dummyHead</text>
  <rect x="712" y="146" width="168" height="50" rx="5" fill="#eef1f5" stroke="#2f7d6d" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="796.0" y="176.0" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">dummyTail</text>
  <line x1="504" y1="160.0" x2="698.00" y2="160.00" stroke="#3568a3" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="706.00,160.00 698.00,164.60 698.00,155.40" fill="#3568a3"/>
  <line x1="706" y1="182.0" x2="512.00" y2="182.00" stroke="#b5762a" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="504.00,182.00 512.00,177.40 512.00,186.60" fill="#b5762a"/>
  <text x="605" y="154.0" font-size="10.5" fill="#3568a3" text-anchor="middle" font-weight="400">next</text>
  <text x="605" y="201.0" font-size="10.5" fill="#b5762a" text-anchor="middle" font-weight="400">prev</text>
  <rect x="436.0" y="250" width="168" height="50" rx="5" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="520" y="280.0" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">prev (= dummyHead)</text>
  <rect x="436.0" y="356" width="168" height="50" rx="5" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="520" y="386.0" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="400">node (新节点)</text>
  <rect x="436.0" y="462" width="168" height="50" rx="5" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="520" y="492.0" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">next (= 原来的第 1 个)</text>
  <line x1="486" y1="302" x2="486.00" y2="346.00" stroke="#3568a3" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="486.00,354.00 481.40,346.00 490.60,346.00" fill="#3568a3"/>
  <line x1="554" y1="354" x2="554.00" y2="310.00" stroke="#b5762a" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="554.00,302.00 558.60,310.00 549.40,310.00" fill="#b5762a"/>
  <line x1="486" y1="408" x2="486.00" y2="452.00" stroke="#3568a3" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="486.00,460.00 481.40,452.00 490.60,452.00" fill="#3568a3"/>
  <line x1="554" y1="408" x2="554" y2="434.0" stroke="#b5762a" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="554" y1="434.0" x2="554" y2="434.0" stroke="#b5762a" stroke-width="1.7"/>
  <line x1="554" y1="434.0" x2="554.00" y2="452.00" stroke="#b5762a" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="554.00,460.00 549.40,452.00 558.60,452.00" fill="#b5762a"/>
  <line x1="554" y1="408" x2="554" y2="434.0" stroke="#b5762a" stroke-width="1.7"/>
  <text x="790" y="268" font-size="14" fill="#252b33" text-anchor="start" font-weight="600">四处指针都要改</text>
  <text x="790" y="306" font-size="12.5" fill="#3568a3" text-anchor="start" font-weight="400">① prev.next = node</text>
  <text x="790" y="332" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">② node.prev = prev</text>
  <text x="790" y="358" font-size="12.5" fill="#3568a3" text-anchor="start" font-weight="400">③ node.next = next</text>
  <text x="790" y="384" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">④ next.prev = node</text>
  <text x="790" y="446" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">双哨兵保证 prev 与 next 都非空,</text>
  <text x="790" y="470" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">所以这四行不需要任何判空分支。</text>
  <text x="790" y="512" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">没有哨兵时「在头部插入」意味着 prev 为空指针,</text>
  <text x="790" y="536" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">这四行直接崩 —— 于是又得加特判。</text>
</svg>
