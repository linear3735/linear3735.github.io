<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title desc">
  <title id="title">沿一次请求读懂推理</title>
  <desc id="desc">先看生成、缓存、调度与 GPU 执行，再进入多卡、MoE 和量化。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="310" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">从生成一枚 token 开始</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">请求 A 有 6 个提示词 token，要生成 3 个。</text>
    <rect x="24.0" y="88" width="128.5" height="80" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="88.25" y="119" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">生成</text>
    <text x="88.25" y="145" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">选择 token</text>
    <line x1="156.5" y1="128" x2="173.5" y2="128" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <rect x="178.5" y="88" width="128.5" height="80" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="242.75" y="119" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">缓存</text>
    <text x="242.75" y="145" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">保留 K/V</text>
    <line x1="311.0" y1="128" x2="328.0" y2="128" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <rect x="333.0" y="88" width="128.5" height="80" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="397.25" y="119" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">组批</text>
    <text x="397.25" y="145" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">分配预算</text>
    <line x1="465.5" y1="128" x2="482.5" y2="128" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <rect x="487.5" y="88" width="128.5" height="80" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="551.75" y="119" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">GPU 执行</text>
    <text x="551.75" y="145" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">提交与融合</text>
    <line x1="518" y1="170" x2="518" y2="202" stroke="#cbd5df" stroke-width="1"/>
    <line x1="102" y1="202" x2="518" y2="202" stroke="#cbd5df" stroke-width="1"/>
    <line x1="105" y1="202" x2="105" y2="218" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <line x1="304" y1="202" x2="304" y2="218" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <line x1="509" y1="202" x2="509" y2="218" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <rect x="24" y="220" width="163" height="65" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="105.5" y="259.0" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">多卡通信</text>
    <rect x="222" y="220" width="163" height="65" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="303.5" y="259.0" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">专家路由</text>
    <rect x="420" y="220" width="196" height="65" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="518.0" y="259.0" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">低精度 Linear</text>
  </g>
</svg>
