<svg xmlns="http://www.w3.org/2000/svg" width="640" height="375" viewBox="0 0 640 375" role="img" aria-labelledby="title desc">
  <title id="title">每一轮送入多少个位置</title>
  <desc id="desc">无缓存的 3 轮输入 6、7、8 个位置。复用 KV 的 3 轮输入 6、1、1 个位置。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="375" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">每一轮送入多少个位置</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">纵轴 · 进入模型前向的位置数。横轴 · 生成轮次。</text>
    <line x1="88" y1="288" x2="590" y2="288" stroke="#cbd5df" stroke-width="1"/>
    <text x="76" y="294" fill="#465970" font-size="15" font-weight="500" text-anchor="end">0</text>
    <line x1="88" y1="248" x2="590" y2="248" stroke="#cbd5df" stroke-width="1"/>
    <text x="76" y="254" fill="#465970" font-size="15" font-weight="500" text-anchor="end">2</text>
    <line x1="88" y1="208" x2="590" y2="208" stroke="#cbd5df" stroke-width="1"/>
    <text x="76" y="214" fill="#465970" font-size="15" font-weight="500" text-anchor="end">4</text>
    <line x1="88" y1="168" x2="590" y2="168" stroke="#cbd5df" stroke-width="1"/>
    <text x="76" y="174" fill="#465970" font-size="15" font-weight="500" text-anchor="end">6</text>
    <line x1="88" y1="128" x2="590" y2="128" stroke="#cbd5df" stroke-width="1"/>
    <text x="76" y="134" fill="#465970" font-size="15" font-weight="500" text-anchor="end">8</text>
    <text x="143" y="316" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">第 1 轮</text>
    <text x="331" y="316" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">第 2 轮</text>
    <text x="519" y="316" fill="#465970" font-size="17" font-weight="500" text-anchor="middle">第 3 轮</text>
    <polyline points="143,168 331,148 519,128" fill="none" stroke="#1555a2" stroke-width="4"/>
    <circle cx="143" cy="168" r="6" fill="#1555a2"/>
    <text x="143" y="156" fill="#1555a2" font-size="18" font-weight="650" text-anchor="middle">6</text>
    <circle cx="331" cy="148" r="6" fill="#1555a2"/>
    <text x="331" y="136" fill="#1555a2" font-size="18" font-weight="650" text-anchor="middle">7</text>
    <circle cx="519" cy="128" r="6" fill="#1555a2"/>
    <text x="519" y="116" fill="#1555a2" font-size="18" font-weight="650" text-anchor="middle">8</text>
    <polyline points="143,168 331,268 519,268" fill="none" stroke="#65778c" stroke-width="4"/>
    <circle cx="143" cy="168" r="6" fill="#65778c"/>
    <circle cx="331" cy="268" r="6" fill="#65778c"/>
    <text x="331" y="256" fill="#65778c" font-size="18" font-weight="650" text-anchor="middle">1</text>
    <circle cx="519" cy="268" r="6" fill="#65778c"/>
    <text x="519" y="256" fill="#65778c" font-size="18" font-weight="650" text-anchor="middle">1</text>
    <line x1="24" y1="351" x2="48" y2="351" stroke="#1555a2" stroke-width="4"/>
    <text x="58" y="357" fill="#192334" font-size="17" font-weight="500" text-anchor="start">从头前向</text>
    <line x1="198" y1="351" x2="222" y2="351" stroke="#65778c" stroke-width="4"/>
    <text x="232" y="357" fill="#192334" font-size="17" font-weight="500" text-anchor="start">复用 KV</text>
    <text x="611" y="357" fill="#465970" font-size="17" font-weight="500" text-anchor="end">例子推导</text>
  </g>
</svg>
