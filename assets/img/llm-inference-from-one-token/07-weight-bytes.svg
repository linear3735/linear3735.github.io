<svg xmlns="http://www.w3.org/2000/svg" width="640" height="282" viewBox="0 0 640 282" role="img" aria-labelledby="title desc">
  <title id="title">16 个权重的数值与块 scale</title>
  <desc id="desc">BF16为32，FP8 数值区为16，NVFP4 + 块 scale为9。NVFP4 另含每张量 4 字节 scale。本图未计对齐。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="282" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">16 个权重的数值与块 scale</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">横轴 · 16 个权重占用的字节数。</text>
    <text x="24" y="126" fill="#192334" font-size="20" font-weight="500" text-anchor="start">BF16</text>
    <rect x="218" y="102" width="361" height="32" rx="8" fill="#f3f5f8" stroke="none"/>
    <rect x="218" y="102" width="361.0" height="32" rx="8" fill="#a7b9ce" stroke="none"/>
    <text x="620" y="125" fill="#192334" font-size="20" font-weight="650" text-anchor="end">32</text>
    <text x="24" y="176" fill="#192334" font-size="20" font-weight="500" text-anchor="start">FP8 数值区</text>
    <rect x="218" y="152" width="361" height="32" rx="8" fill="#f3f5f8" stroke="none"/>
    <rect x="218" y="152" width="180.5" height="32" rx="8" fill="#a7b9ce" stroke="none"/>
    <text x="620" y="175" fill="#192334" font-size="20" font-weight="650" text-anchor="end">16</text>
    <text x="24" y="226" fill="#192334" font-size="20" font-weight="500" text-anchor="start">NVFP4 + 块 scale</text>
    <rect x="218" y="202" width="361" height="32" rx="8" fill="#f3f5f8" stroke="none"/>
    <rect x="218" y="202" width="101.53125" height="32" rx="8" fill="#4184ce" stroke="none"/>
    <text x="620" y="225" fill="#1555a2" font-size="20" font-weight="650" text-anchor="end">9</text>
    <text x="24" y="261" fill="#465970" font-size="17" font-weight="500" text-anchor="start">NVFP4 另含每张量 4 字节 scale。本图未计对齐。</text>
  </g>
</svg>
