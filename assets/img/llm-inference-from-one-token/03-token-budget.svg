<svg xmlns="http://www.w3.org/2000/svg" width="640" height="331" viewBox="0 0 640 331" role="img" aria-labelledby="title desc">
  <title id="title">同一轮怎样给 A 和 B 分配预算</title>
  <desc id="desc">第一轮 A prefill 6，第二轮 A decode 1 和 B prefill 4，第三轮 A decode 1 和 B decode 1。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="331" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">同一轮怎样给 A 和 B 分配预算</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">每轮最多 6 个新输入位置。单位为 token。</text>
    <text x="24" y="136" fill="#192334" font-size="20" font-weight="500" text-anchor="start">第 1 轮</text>
    <rect x="136" y="110" width="444" height="35" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <rect x="136" y="110" width="444" height="35" rx="8" fill="#2d69ae" stroke="none"/>
    <text x="358" y="135" fill="white" font-size="19" font-weight="700" text-anchor="middle">A · 6</text>
    <text x="617" y="135" fill="#192334" font-size="20" font-weight="650" text-anchor="end">6</text>
    <text x="24" y="194" fill="#192334" font-size="20" font-weight="500" text-anchor="start">第 2 轮</text>
    <rect x="136" y="168" width="444" height="35" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <rect x="136" y="168" width="74" height="35" rx="8" fill="#2d69ae" stroke="none"/>
    <text x="173" y="193" fill="white" font-size="19" font-weight="700" text-anchor="middle">A · 1</text>
    <rect x="210" y="168" width="296" height="35" rx="8" fill="#465970" stroke="none"/>
    <text x="358" y="193" fill="white" font-size="19" font-weight="700" text-anchor="middle">B · 4</text>
    <text x="617" y="193" fill="#192334" font-size="20" font-weight="650" text-anchor="end">5</text>
    <text x="24" y="252" fill="#192334" font-size="20" font-weight="500" text-anchor="start">第 3 轮</text>
    <rect x="136" y="226" width="444" height="35" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <rect x="136" y="226" width="74" height="35" rx="8" fill="#2d69ae" stroke="none"/>
    <text x="173" y="251" fill="white" font-size="19" font-weight="700" text-anchor="middle">A · 1</text>
    <rect x="210" y="226" width="74" height="35" rx="8" fill="#465970" stroke="none"/>
    <text x="247" y="251" fill="white" font-size="19" font-weight="700" text-anchor="middle">B · 1</text>
    <text x="617" y="251" fill="#192334" font-size="20" font-weight="650" text-anchor="end">2</text>
    <text x="24" y="305" fill="#465970" font-size="17" font-weight="500" text-anchor="start">A 在第 1 轮出首 token，B 在第 2 轮出首 token。</text>
  </g>
</svg>
