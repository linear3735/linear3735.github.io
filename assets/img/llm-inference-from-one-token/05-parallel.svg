<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">三种并行各自切哪里</title>
  <desc id="desc">TP 切同层矩阵，PP 切层，DP 分请求。图示只表示工作分工。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="330" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">TP 切矩阵，PP 切层，DP 分请求</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">GPU 0 与 GPU 1 的分工示意。</text>
    <text x="24" y="120" fill="#1555a2" font-size="24" font-weight="700" text-anchor="start">TP</text>
    <rect x="95" y="88" width="240" height="52" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="215.0" y="120.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">GPU 0 · 局部矩阵</text>
    <rect x="355" y="88" width="261" height="52" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="485.5" y="120.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">GPU 1 · 局部矩阵</text>
    <text x="24" y="193" fill="#1555a2" font-size="24" font-weight="700" text-anchor="start">PP</text>
    <rect x="95" y="161" width="225" height="52" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="207.5" y="193.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">GPU 0 · 前几层</text>
    <line x1="325" y1="187" x2="350" y2="187" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <rect x="357" y="161" width="259" height="52" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="486.5" y="193.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">GPU 1 · 后几层</text>
    <text x="24" y="266" fill="#1555a2" font-size="24" font-weight="700" text-anchor="start">DP</text>
    <rect x="95" y="234" width="240" height="52" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="215.0" y="266.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">副本 0 · 请求 A</text>
    <rect x="355" y="234" width="261" height="52" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="485.5" y="266.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">副本 1 · 请求 B</text>
  </g>
</svg>
