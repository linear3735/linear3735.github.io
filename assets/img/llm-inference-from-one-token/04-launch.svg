<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">CPU 怎样提交同一段 GPU 工作</title>
  <desc id="desc">逐个 launch 有三次 CPU 提交。捕获完成后的 replay 只提交一次，图中 GPU 仍画三个阶段。横向距离无时间单位。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="330" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">逐个提交和重放一次图</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">同一轮 decode 的示意。横向位置表示顺序。</text>
    <text x="24" y="110" fill="#192334" font-size="21" font-weight="650" text-anchor="start">逐个提交</text>
    <rect x="24" y="125" width="182" height="62" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="115.0" y="162.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">CPU 提交 A</text>
    <rect x="229" y="125" width="182" height="62" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="320.0" y="162.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">CPU 提交 B</text>
    <rect x="434" y="125" width="182" height="62" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="525.0" y="162.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">CPU 提交 C</text>
    <text x="24" y="222" fill="#192334" font-size="21" font-weight="650" text-anchor="start">Graph 已捕获</text>
    <rect x="24" y="238" width="174" height="59" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="111.0" y="274.0" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">CPU 重放</text>
    <line x1="202" y1="267" x2="225" y2="267" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <rect x="232" y="238" width="384" height="59" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="424.0" y="274.0" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">GPU 操作 A → B → C</text>
  </g>
</svg>
