<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">逻辑位置怎样落到物理页</title>
  <desc id="desc">逻辑页 0 对应物理页 5 和槽 20–23。逻辑页 1 对应物理页 2 和槽 8–11。位置 6 对应槽 10。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#1555a2" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="640" height="320" rx="12" fill="#fff" stroke="#cbd5df"/>
    <text x="24" y="37" fill="#192334" font-size="25" font-weight="700" text-anchor="start">逻辑位置怎样落到物理页</text>
    <text x="24" y="66" fill="#465970" font-size="17" font-weight="500" text-anchor="start">每页 4 个 KV 槽。逻辑页表按序列保存。</text>
    <rect x="24" y="103" width="154" height="58" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="101.0" y="138.5" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">逻辑页 0</text>
    <line x1="185" y1="132" x2="213" y2="132" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <text x="233" y="124" fill="#192334" font-size="20" font-weight="650" text-anchor="start">物理页 5</text>
    <rect x="355" y="104" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="383" y="139" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">20</text>
    <rect x="421" y="104" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="449" y="139" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">21</text>
    <rect x="487" y="104" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="515" y="139" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">22</text>
    <rect x="553" y="104" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="581" y="139" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">23</text>
    <rect x="24" y="193" width="154" height="58" rx="8" fill="#e6f0ff" stroke="#cbd5df"/>
    <text x="101.0" y="228.5" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">逻辑页 1</text>
    <line x1="185" y1="222" x2="213" y2="222" stroke="#1555a2" stroke-width="2" marker-end="url(#tip)"/>
    <text x="233" y="214" fill="#192334" font-size="20" font-weight="650" text-anchor="start">物理页 2</text>
    <rect x="355" y="194" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="383" y="229" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">8</text>
    <rect x="421" y="194" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="449" y="229" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">9</text>
    <rect x="487" y="194" width="56" height="56" rx="8" fill="#e6f0ff" stroke="#1555a2"/>
    <text x="515" y="229" fill="#1555a2" font-size="22" font-weight="650" text-anchor="middle">10</text>
    <rect x="553" y="194" width="56" height="56" rx="8" fill="#f3f5f8" stroke="#cbd5df"/>
    <text x="581" y="229" fill="#192334" font-size="22" font-weight="650" text-anchor="middle">11</text>
    <text x="24" y="291" fill="#1555a2" font-size="20" font-weight="650" text-anchor="start">a₁ 在逻辑位置 6，落在物理槽 10。</text>
  </g>
</svg>
