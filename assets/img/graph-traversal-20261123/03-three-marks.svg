<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
  <rect width="900" height="400" fill="#ffffff"/>
  <rect x="20" y="24" width="860" height="96" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="52" font-size="14" fill="#3568a3" text-anchor="start" font-weight="600">visited[u]</text>
  <text x="40" y="78" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">进入时置位, 永不撤销</text>
  <text x="40" y="102" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">回答: 我来过这里吗</text>
  <text x="460" y="66" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">遍历所有节点 / 求连通分量 / 可达性</text>
  <text x="460" y="92" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">每个节点只处理一次 -&gt; O(E+V)</text>
  <rect x="20" y="136" width="860" height="96" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="164" font-size="14" fill="#b5762a" text-anchor="start" font-weight="600">onPath[u]</text>
  <text x="40" y="190" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">进入时置位, 离开时清除</text>
  <text x="40" y="214" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">回答: 我现在站在这里吗</text>
  <text x="460" y="178" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">有向图判环 / 枚举所有路径</text>
  <text x="460" y="204" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">配合 visited 才能剪枝到 O(E+V)</text>
  <rect x="20" y="248" width="860" height="96" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="276" font-size="14" fill="#2f7d6d" text-anchor="start" font-weight="600">visited[u][v]</text>
  <text x="40" y="302" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">走过这条边时置位</text>
  <text x="40" y="326" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">回答: 这条边走过吗</text>
  <text x="460" y="290" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">欧拉路径 / 无向图枚举路径</text>
  <text x="460" y="316" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">标记要放进 for 内部, 因为边有两个端点</text>
  <text x="460" y="338" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">代价: 时间 O(E+V^2), 空间 O(V^2)</text>
</svg>
