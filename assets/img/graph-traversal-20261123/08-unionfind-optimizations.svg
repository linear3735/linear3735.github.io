<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img">
  <rect width="900" height="440" fill="#ffffff"/>
  <rect x="20" y="30" width="420" height="380" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">朴素: 退化成一条链</text>
  <circle cx="80" cy="130" r="19" fill="#e8eff7" stroke="#3568a3" stroke-width="1.6"/>
  <text x="80" y="135.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="160" cy="130" r="19" fill="#eef1f5" stroke="#737c88" stroke-width="1.6"/>
  <text x="160" y="135.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="240" cy="130" r="19" fill="#eef1f5" stroke="#737c88" stroke-width="1.6"/>
  <text x="240" y="135.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="320" cy="130" r="19" fill="#eef1f5" stroke="#737c88" stroke-width="1.6"/>
  <text x="320" y="135.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="400" cy="130" r="19" fill="#eef1f5" stroke="#737c88" stroke-width="1.6"/>
  <text x="400" y="135.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <line x1="100.0" y1="130.0" x2="132.00" y2="130.00" stroke="#737c88" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="140.00,130.00 132.00,134.60 132.00,125.40" fill="#737c88"/>
  <line x1="180.0" y1="130.0" x2="212.00" y2="130.00" stroke="#737c88" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="220.00,130.00 212.00,134.60 212.00,125.40" fill="#737c88"/>
  <line x1="260.0" y1="130.0" x2="292.00" y2="130.00" stroke="#737c88" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="300.00,130.00 292.00,134.60 292.00,125.40" fill="#737c88"/>
  <line x1="340.0" y1="130.0" x2="372.00" y2="130.00" stroke="#737c88" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="380.00,130.00 372.00,134.60 372.00,125.40" fill="#737c88"/>
  <text x="240" y="90" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">parent 指针</text>
  <text x="40" y="200" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">union(0,1) union(1,2) union(2,3) ...</text>
  <text x="40" y="228" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">每次都把 p 的根挂到 q 的根下面</text>
  <text x="40" y="274" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">find(0) 要爬 4 层</text>
  <text x="40" y="300" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">n 个节点最坏 O(n)</text>
  <text x="40" y="344" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">只做路径压缩也不够: union 还能</text>
  <text x="40" y="368" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">把大树挂到小树下, 重新造深树</text>
  <rect x="470" y="30" width="410" height="380" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="482" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">两个优化都加上</text>
  <circle cx="600" cy="130" r="21" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.6"/>
  <text x="600" y="135.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <line x1="532.9397773488511" y1="222.20780614532984" x2="582.35" y2="154.26" stroke="#2f7d6d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="587.06,147.79 586.08,156.97 578.63,151.56" fill="#2f7d6d"/>
  <circle cx="520" cy="240" r="19" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.6"/>
  <text x="520" y="245.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <line x1="600.0" y1="228.0" x2="600.00" y2="160.00" stroke="#2f7d6d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="600.00,152.00 604.60,160.00 595.40,160.00" fill="#2f7d6d"/>
  <circle cx="600" cy="250" r="19" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.6"/>
  <text x="600" y="255.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <line x1="667.0602226511489" y1="222.20780614532984" x2="617.65" y2="154.26" stroke="#2f7d6d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="612.94,147.79 621.37,151.56 613.92,156.97" fill="#2f7d6d"/>
  <circle cx="680" cy="240" r="19" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.6"/>
  <text x="680" y="245.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="600" y="320" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">路径压缩后: 全部直接挂在根上</text>
  <text x="490" y="356" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">按秩合并保证树高 O(log n)</text>
  <text x="490" y="380" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">路径压缩保证爬过的路只爬一次</text>
  <text x="490" y="404" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">合起来摊还 O(alpha(n)) &lt;= O(1)</text>
</svg>
