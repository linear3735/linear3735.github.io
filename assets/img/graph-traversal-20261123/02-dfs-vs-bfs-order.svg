<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
  <rect width="900" height="400" fill="#ffffff"/>
  <rect x="20" y="30" width="300" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">同一个图, 从节点 0 出发</text>
  <line x1="170" y1="90" x2="95" y2="200" stroke="#252b33" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="170" y1="90" x2="245" y2="200" stroke="#252b33" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="95" y1="200" x2="60" y2="300" stroke="#252b33" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="95" y1="200" x2="140" y2="300" stroke="#252b33" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="170" cy="90" r="19" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="170" y="95.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="95" cy="200" r="19" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="95" y="205.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="245" cy="200" r="19" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="245" y="205.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="60" cy="300" r="19" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="60" y="305.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="140" cy="300" r="19" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="140" y="305.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <text x="36" y="356" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">邻接表插入顺序: 0:[1,2] 1:[0,3,4]</text>
  <rect x="350" y="30" width="250" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="362" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">DFS: 栈顶取</text>
  <text x="475" y="82" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">访问序 = 前序位置</text>
  <text x="368" y="118" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">栈: [0]</text>
  <text x="368" y="150" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">弹 0 -&gt; 逆序压 2,1</text>
  <text x="368" y="182" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">弹 1 -&gt; 逆序压 4,3</text>
  <text x="368" y="214" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">弹 3</text>
  <text x="368" y="246" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">弹 4</text>
  <text x="368" y="278" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">弹 2</text>
  <rect x="360" y="312" width="230" height="46" rx="6" fill="#fdf0e3" stroke="#fdf0e3" stroke-width="1.4"/>
  <text x="475" y="341" font-size="15" fill="#b5762a" text-anchor="middle" font-weight="600">0 1 3 4 2</text>
  <rect x="630" y="30" width="250" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="642" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">BFS: 队头取</text>
  <text x="755" y="82" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">dist[] 既去重又记层</text>
  <text x="648" y="118" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">队: [0]  dist0=0</text>
  <text x="648" y="150" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 0 -&gt; 1,2 dist=1</text>
  <text x="648" y="182" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 1 -&gt; 3,4 dist=2</text>
  <text x="648" y="214" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 2</text>
  <text x="648" y="246" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 3</text>
  <text x="648" y="278" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 4</text>
  <rect x="640" y="312" width="230" height="46" rx="6" fill="#e4f1ee" stroke="#e4f1ee" stroke-width="1.4"/>
  <text x="755" y="341" font-size="15" fill="#2f7d6d" text-anchor="middle" font-weight="600">0 1 2 3 4</text>
</svg>
