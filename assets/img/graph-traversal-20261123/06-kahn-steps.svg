  <rect x="605" y="96" width="36" height="40" rx="0" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="623" y="122" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="567.5" y="158" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">节点 0 1 2 3 的入度</text>
  <rect x="479" y="180" width="177" height="44" rx="6" fill="#e8eff7" stroke="#e8eff7" stroke-width="1.4"/>
  <text x="567.5" y="207" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="600">队: [2]</text>
  <text x="567.5" y="258" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">出 1, 3 减到 1</text>
  <text x="567.5" y="300" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">order = 2 个</text>
  <rect x="685" y="40" width="205" height="300" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
