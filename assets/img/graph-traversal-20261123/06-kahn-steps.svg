  <text x="347.5" y="207" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="600">队: [1, 2]</text>
  <text x="347.5" y="258" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">出 0, 1 和 2 归零</text>
  <text x="347.5" y="300" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">order = 1 个</text>
  <rect x="465" y="40" width="205" height="300" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="567.5" y="68" font-size="14" fill="#3568a3" text-anchor="middle" font-weight="600">第 2 轮</text>
  <rect x="497" y="96" width="36" height="40" rx="0" fill="#eef1f5" stroke="#e7eaf0" stroke-width="1.4"/>
