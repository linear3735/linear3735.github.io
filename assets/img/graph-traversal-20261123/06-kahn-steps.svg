  <text x="771" y="122" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">-</text>
  <rect x="789" y="96" width="36" height="40" rx="0" fill="#eef1f5" stroke="#e7eaf0" stroke-width="1.4"/>
  <text x="807" y="122" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">-</text>
  <rect x="825" y="96" width="36" height="40" rx="0" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="843" y="122" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="400">0</text>
  <text x="787.5" y="158" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">节点 0 1 2 3 的入度</text>
  <rect x="699" y="180" width="177" height="44" rx="6" fill="#e8eff7" stroke="#e8eff7" stroke-width="1.4"/>
  <text x="787.5" y="207" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="600">队: [3]</text>
  <text x="787.5" y="258" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">出 2, 3 归零</text>
  <text x="787.5" y="300" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="400">order = 3 个</text>
  <text x="25" y="380" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">每轮把入度归零的节点入队; 出队时把它的后继入度减 1。出队总数 == V 才存在拓扑序。</text>
  <text x="25" y="408" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">如果有环 (例如 1 -&gt; 2 -&gt; 1), 这两个节点的入度永远减不到 0, 出队总数就会小于 V。</text>
</svg>
