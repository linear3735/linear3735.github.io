  <text x="32" y="304" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">邻接表的代价</text>
  <text x="34" y="330" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">空间 O(V+E)</text>
  <text x="34" y="356" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">查 u-v 有无边 O(deg u)</text>
  <text x="34" y="382" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">枚举邻居 O(deg u)</text>
  <text x="34" y="408" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="400">遍历整图 O(E+V)</text>
  <rect x="290" y="280" width="260" height="140" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="302" y="304" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">邻接矩阵的代价</text>
  <text x="304" y="330" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">空间 O(V^2)</text>
  <text x="304" y="356" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">查 u-v 有无边 O(1)</text>
  <text x="304" y="382" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">枚举邻居 O(V)</text>
  <text x="304" y="408" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="400">遍历整图 O(V^2)</text>
  <rect x="570" y="280" width="310" height="140" rx="10" fill="#fdf0e3" stroke="#fdf0e3" stroke-width="1.2"/>
  <text x="582" y="304" font-size="13" fill="#b5762a" text-anchor="start" font-weight="600">怎么选</text>
  <text x="582" y="334" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">简单图里 0 &lt;= E &lt;= V(V-1)/2</text>
  <text x="582" y="360" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">E 接近 V^2 -&gt; 稠密 -&gt; 矩阵</text>
  <text x="582" y="386" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">E 远小于 V^2 -&gt; 稀疏 -&gt; 邻接表</text>
  <text x="582" y="410" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">要三层循环的算法(Floyd)偏爱矩阵</text>
