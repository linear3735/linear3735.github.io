<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
  <rect width="900" height="400" fill="#ffffff"/>
  <rect x="20" y="30" width="500" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">edges = [[1,2],[1,3],[2,3]]</text>
  <line x1="170" y1="140" x2="330" y2="140" stroke="#252b33" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="170" y1="140" x2="250" y2="280" stroke="#252b33" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="330" y1="140" x2="250" y2="280" stroke="#b5762a" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="170" cy="140" r="20" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="170" y="145.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="330" cy="140" r="20" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="330" y="145.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="250" cy="280" r="20" fill="#fdf0e3" stroke="#252b33" stroke-width="1.6"/>
  <text x="250" y="285.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="250" y="210" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="400">这条边多余</text>
  <text x="40" y="320" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">加入 (1,2): 合并成功</text>
  <text x="40" y="344" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">加入 (1,3): 合并成功</text>
  <rect x="550" y="30" width="330" height="340" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="562" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">并查集判环</text>
  <text x="568" y="82" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">加入 (1,2) -&gt; union 返回 true</text>
  <text x="568" y="110" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">加入 (1,3) -&gt; union 返回 true</text>
  <text x="568" y="138" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">加入 (2,3) -&gt; 2 和 3 已连通</text>
  <text x="568" y="166" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">union 返回 false</text>
  <rect x="562" y="194" width="306" height="52" rx="6" fill="#fdf0e3" stroke="#fdf0e3" stroke-width="1.4"/>
  <text x="715" y="214" font-size="11" fill="#b5762a" text-anchor="middle" font-weight="400">返回 false 的那一刻</text>
  <text x="715" y="236" font-size="14" fill="#b5762a" text-anchor="middle" font-weight="600">就是多余的边 [2,3]</text>
  <text x="568" y="286" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">不需要额外判环: 树上两点</text>
  <text x="568" y="310" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">之间本来就只有一条路径</text>
  <text x="568" y="346" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">同一个判断也是 Kruskal 的零件</text>
</svg>
