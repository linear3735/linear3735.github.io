<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img">
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="20" y="30" width="420" height="360" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">偶环: 可以二染色</text>
  <line x1="110" y1="120" x2="250" y2="120" stroke="#3568a3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="250" y1="120" x2="250" y2="260" stroke="#3568a3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="250" y1="260" x2="110" y2="260" stroke="#3568a3" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="110" y1="260" x2="110" y2="120" stroke="#3568a3" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="110" cy="120" r="20" fill="#e8eff7" stroke="#3568a3" stroke-width="1.6"/>
  <text x="110" y="125.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="250" cy="120" r="20" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.6"/>
  <text x="250" y="125.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="250" cy="260" r="20" fill="#e8eff7" stroke="#3568a3" stroke-width="1.6"/>
  <text x="250" y="265.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="110" cy="260" r="20" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.6"/>
  <text x="110" y="265.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="40" y="316" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">走 4 条边回到起点, 颜色翻转 4 次</text>
  <text x="40" y="342" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="400">偶数次翻转 -&gt; 回到原色, 自洽</text>
  <text x="40" y="370" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">所以是二分图 (785 例 2)</text>
  <rect x="470" y="30" width="410" height="360" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="482" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">奇环: 一定不是二分图</text>
  <line x1="600" y1="140" x2="760" y2="140" stroke="#b5762a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="760" y1="140" x2="680" y2="280" stroke="#b5762a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="680" y1="280" x2="600" y2="140" stroke="#b5762a" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="600" cy="140" r="20" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.6"/>
  <text x="600" y="145.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="760" cy="140" r="20" fill="#e8eff7" stroke="#3568a3" stroke-width="1.6"/>
  <text x="760" y="145.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="680" cy="280" r="20" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.6"/>
  <text x="680" y="285.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <text x="490" y="316" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">0 和 2 都染成 A 色, 但它们相邻</text>
  <text x="490" y="342" font-size="13" fill="#b5762a" text-anchor="start" font-weight="400">染色法在这里报冲突 -&gt; 返回 false</text>
  <text x="490" y="370" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">等价说法: 有奇环 (785 例 1)</text>
</svg>
