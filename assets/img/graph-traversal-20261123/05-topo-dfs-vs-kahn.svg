<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img">
  <rect width="900" height="430" fill="#ffffff"/>
  <rect x="20" y="30" width="300" height="370" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="32" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">要排序的 DAG</text>
  <line x1="132.0" y1="110.0" x2="200.00" y2="110.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="208.00,110.00 200.00,114.60 200.00,105.40" fill="#3568a3"/>
  <line x1="110.0" y1="132.0" x2="110.00" y2="200.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="110.00,208.00 105.40,200.00 114.60,200.00" fill="#3568a3"/>
  <line x1="230.0" y1="132.0" x2="230.00" y2="200.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="230.00,208.00 225.40,200.00 234.60,200.00" fill="#3568a3"/>
  <line x1="132.0" y1="230.0" x2="200.00" y2="230.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="208.00,230.00 200.00,234.60 200.00,225.40" fill="#3568a3"/>
  <circle cx="110" cy="110" r="20" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="110" y="115.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <circle cx="230" cy="110" r="20" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="230" y="115.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="110" cy="230" r="20" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="110" y="235.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="230" cy="230" r="20" fill="#ffffff" stroke="#252b33" stroke-width="1.6"/>
  <text x="230" y="235.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <text x="40" y="320" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">边 = 被依赖: 0 -&gt; 1 表示</text>
  <text x="40" y="344" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">做完 0 才能做 1</text>
  <text x="40" y="372" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">入度: 0:0  1:1  2:1  3:2</text>
  <rect x="340" y="30" width="270" height="370" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="352" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">DFS: 后序 + 反转</text>
  <text x="358" y="92" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">离开 3 -&gt; post=[3]</text>
  <text x="358" y="122" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">离开 1 -&gt; post=[3,1]</text>
  <text x="358" y="152" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">离开 2 -&gt; post=[3,1,2]</text>
  <text x="358" y="182" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">离开 0 -&gt; post=[3,1,2,0]</text>
  <text x="358" y="224" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">post 的性质: 每条边 u-&gt;v</text>
  <text x="358" y="246" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">都有 v 排在 u 前面</text>
  <rect x="352" y="276" width="246" height="50" rx="6" fill="#fdf0e3" stroke="#fdf0e3" stroke-width="1.4"/>
  <text x="475" y="292" font-size="11" fill="#b5762a" text-anchor="middle" font-weight="400">反转 post</text>
  <text x="475" y="314" font-size="16" fill="#b5762a" text-anchor="middle" font-weight="600">0 2 1 3</text>
  <text x="358" y="356" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">撞到灰 -&gt; 直接返回空</text>
  <rect x="630" y="30" width="250" height="370" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="642" y="54" font-size="13" fill="#3568a3" text-anchor="start" font-weight="600">Kahn: 入度归零</text>
  <text x="648" y="92" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">入度 0 的入队: [0]</text>
  <text x="648" y="122" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 0 -&gt; 1,2 入度 0</text>
  <text x="648" y="152" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">入队 [1,2]</text>
  <text x="648" y="182" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 1 -&gt; 3 入度 1</text>
  <text x="648" y="212" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 2 -&gt; 3 入度 0</text>
  <text x="648" y="242" font-size="13" fill="#252b33" text-anchor="start" font-weight="400">出 3</text>
  <rect x="642" y="276" width="226" height="50" rx="6" fill="#e4f1ee" stroke="#e4f1ee" stroke-width="1.4"/>
  <text x="755" y="292" font-size="11" fill="#2f7d6d" text-anchor="middle" font-weight="400">出队顺序</text>
  <text x="755" y="314" font-size="16" fill="#2f7d6d" text-anchor="middle" font-weight="600">0 1 2 3</text>
  <text x="648" y="356" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">出队数 &lt; V -&gt; 有环</text>
</svg>
