  <text x="302" y="430" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">借位只影响最低位的 1 及其右侧:右边 0 全变 1,更高的位两边相同</text>
  <text x="302" y="458" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="400">44 &amp; 43 = 40:最低位的 1 被消掉</text>
