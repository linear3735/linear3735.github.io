  <text x="878" y="430" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">-n = ~n + 1:低位的 0 取反成 1 又被进位带回 0,最低位的 1 原地留下</text>
  <text x="878" y="458" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="400">44 &amp; -44 = 4 = 2^2,下标 2 就是它的位置</text>
  <text x="590.0" y="536" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">减一之后做与 = 干掉最低位的 1;取负之后做与 = 留下最低位的 1</text>
