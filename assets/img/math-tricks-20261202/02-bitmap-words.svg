  <rect x="241" y="224" width="56" height="56" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.2"/>
  <text x="269.0" y="258.72" font-size="18" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <rect x="307" y="224" width="56" height="56" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="335.0" y="258.72" font-size="18" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <rect x="373" y="224" width="56" height="56" rx="4" fill="#ffffff" stroke="#252b33" stroke-width="1.2"/>
  <text x="401.0" y="258.72" font-size="18" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <text x="302" y="316" font-size="13.5" fill="#252b33" text-anchor="middle" font-weight="400">8 个布尔 = 8 字节 = 64 比特</text>
  <text x="302" y="346" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">真正携带信息的只有 8 比特,其余 56 比特是浪费(7/8)</text>
  <text x="302" y="376" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">所以日常开发用布尔数组就够了</text>
  <rect x="604" y="84" width="548" height="330" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="878" y="118" font-size="16" fill="#252b33" text-anchor="middle" font-weight="600">位图:1 个 64 位字装 64 个布尔</text>
  <rect x="623" y="170" width="30" height="56" rx="3" fill="#fdf0e3" stroke="#252b33" stroke-width="1.1"/>
  <text x="638.0" y="204" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <rect x="655" y="170" width="30" height="56" rx="3" fill="#ffffff" stroke="#252b33" stroke-width="1.1"/>
  <text x="670.0" y="204" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
