  <rect x="1103" y="170" width="30" height="56" rx="3" fill="#ffffff" stroke="#252b33" stroke-width="1.1"/>
  <text x="1118.0" y="204" font-size="13" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <text x="638" y="248" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">bit 63</text>
  <text x="1118" y="248" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">bit 48</text>
  <text x="878" y="278" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">(画的是字里的高 16 位,其余 48 位同理)</text>
  <text x="878" y="314" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">第 i 位 → words[i &gt;&gt; 6] 的第 (i &amp; 63) 位</text>
  <text x="878" y="344" font-size="13" fill="#737c88" text-anchor="middle" font-weight="400">64 = 2^6,所以 i % 64 等价于 i &amp; 63</text>
  <text x="878" y="374" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="400">i = 100 → 字下标 1、位偏移 36</text>
  <text x="590.0" y="460" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">代价:字下标与位偏移要自己算,换来的内存是原来的 1/8</text>
  <text x="590.0" y="492" font-size="13.5" fill="#737c88" text-anchor="middle" font-weight="400">集合没大到布尔数组开不下时,不值得换成位图</text>
</svg>
