<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img">
  <rect width="1180" height="560" fill="#ffffff"/>
  <text x="590.0" y="50" font-size="20" fill="#252b33" text-anchor="middle" font-weight="600">位图:8 字节装 64 个布尔,而不是 8 个</text>
  <rect x="28" y="84" width="548" height="330" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="302" y="118" font-size="16" fill="#252b33" text-anchor="middle" font-weight="600">boolean[]:每个元素占 1 字节</text>
