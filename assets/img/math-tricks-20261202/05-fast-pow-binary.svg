<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" role="img">
  <rect width="1180" height="580" fill="#ffffff"/>
  <text x="590.0" y="50" font-size="19" fill="#252b33" text-anchor="middle" font-weight="600">快速幂:b = 13 = 0b1101,指数拆成 8 + 4 + 1</text>
  <rect x="28" y="84" width="1124" height="216" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="290" y="124" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 3</text>
  <rect x="262" y="150" width="56" height="56" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="290" y="187" font-size="22" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <text x="290" y="232" font-size="12.5" fill="#737c88" text-anchor="middle" font-weight="400">权 8</text>
  <text x="290" y="262" font-size="12.5" fill="#b5762a" text-anchor="middle" font-weight="400">乘进 res</text>
  <text x="490" y="124" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 2</text>
  <rect x="462" y="150" width="56" height="56" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="490" y="187" font-size="22" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <text x="490" y="232" font-size="12.5" fill="#737c88" text-anchor="middle" font-weight="400">权 4</text>
  <text x="490" y="262" font-size="12.5" fill="#b5762a" text-anchor="middle" font-weight="400">乘进 res</text>
  <text x="690" y="124" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 1</text>
  <rect x="662" y="150" width="56" height="56" rx="4" fill="#eef1f5" stroke="#252b33" stroke-width="1.2"/>
  <text x="690" y="187" font-size="22" fill="#252b33" text-anchor="middle" font-weight="600">0</text>
  <text x="690" y="232" font-size="12.5" fill="#737c88" text-anchor="middle" font-weight="400">权 2</text>
  <text x="690" y="262" font-size="12.5" fill="#737c88" text-anchor="middle" font-weight="400">跳过</text>
  <text x="890" y="124" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 0</text>
  <rect x="862" y="150" width="56" height="56" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="890" y="187" font-size="22" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <text x="890" y="232" font-size="12.5" fill="#737c88" text-anchor="middle" font-weight="400">权 1</text>
  <text x="890" y="262" font-size="12.5" fill="#b5762a" text-anchor="middle" font-weight="400">乘进 res</text>
  <text x="590" y="288" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">13 的二进制里,第 0、2、3 位是 1</text>
  <rect x="28" y="324" width="1124" height="190" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="590" y="356" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">底数逐次平方:a^(2^t) 由上一项平方得到</text>
  <rect x="130.0" y="396" width="120" height="56" rx="6" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="190" y="432" font-size="16" fill="#252b33" text-anchor="middle" font-weight="600">a^1</text>
  <rect x="390.0" y="396" width="120" height="56" rx="6" fill="#e8eff7" stroke="#252b33" stroke-width="1.2"/>
  <text x="450" y="432" font-size="16" fill="#252b33" text-anchor="middle" font-weight="600">a^2</text>
  <rect x="650.0" y="396" width="120" height="56" rx="6" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="710" y="432" font-size="16" fill="#252b33" text-anchor="middle" font-weight="600">a^4</text>
  <rect x="910.0" y="396" width="120" height="56" rx="6" fill="#fdf0e3" stroke="#252b33" stroke-width="1.2"/>
  <text x="970" y="432" font-size="16" fill="#252b33" text-anchor="middle" font-weight="600">a^8</text>
  <line x1="258.0" y1="424.0" x2="374.00" y2="424.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="382.00,424.00 374.00,428.60 374.00,419.40" fill="#3568a3"/>
  <text x="320.0" y="406.0" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">平方</text>
  <line x1="518.0" y1="424.0" x2="634.00" y2="424.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="642.00,424.00 634.00,428.60 634.00,419.40" fill="#3568a3"/>
  <text x="580.0" y="406.0" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">平方</text>
  <line x1="778.0" y1="424.0" x2="894.00" y2="424.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="902.00,424.00 894.00,428.60 894.00,419.40" fill="#3568a3"/>
  <text x="840.0" y="406.0" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">平方</text>
  <text x="190" y="478" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 0 用到</text>
  <text x="450" y="478" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 1:跳过</text>
  <text x="710" y="478" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 2 用到</text>
  <text x="970" y="478" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">bit 3 用到</text>
  <text x="590.0" y="548" font-size="14" fill="#737c88" text-anchor="middle" font-weight="400">res = a^1 × a^4 × a^8 = a^13;乘法次数 = b 的位数 ≈ log2 b,而不是 b</text>
</svg>
