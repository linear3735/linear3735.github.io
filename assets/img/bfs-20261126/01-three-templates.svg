<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" role="img">
  <rect width="1240" height="716" fill="#ffffff"/>
  <text x="620" y="36" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">同一张 4 层小图:三种模板的差别只在「什么时候 step++」</text>
  <text x="620" y="60" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">层数、出队顺序、step 的取值都是这张图真跑出来的;从 S 到 T 的最短步数是 3</text>
  <rect x="30" y="84" width="1180" height="300" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="210" y="120" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">第 0 层</text>
  <text x="490" y="120" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">第 1 层</text>
  <text x="780" y="120" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">第 2 层</text>
  <text x="1050" y="120" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">第 3 层</text>
  <line x1="240.68843430349617" y1="215.6159379566434" x2="451.39" y2="185.52" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="459.31,184.38 452.04,190.07 450.74,180.96" fill="#3568a3"/>
  <line x1="240.65702693891723" y1="224.5985540408376" x2="451.43" y2="256.21" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="459.34,257.40 450.75,260.76 452.11,251.67" fill="#3568a3"/>
  <line x1="520.9111798607864" y1="177.6550139415955" x2="741.11" y2="160.95" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="749.09,160.34 741.46,165.54 740.76,156.36" fill="#3568a3"/>
  <line x1="520.7092550065477" y1="184.23575931124796" x2="741.37" y2="214.67" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="749.29,215.76 740.74,219.23 741.99,210.11" fill="#3568a3"/>
  <line x1="520.6799136937817" y1="257.55670215469365" x2="741.40" y2="225.59" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="749.32,224.44 742.06,230.14 740.74,221.04" fill="#3568a3"/>
  <line x1="520.9265401811125" y1="264.1328648400767" x2="741.09" y2="279.32" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="749.07,279.87 740.78,283.91 741.41,274.73" fill="#3568a3"/>
  <line x1="810.2136533601836" y1="164.93795003085697" x2="1011.99" y2="211.27" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="1019.79,213.06 1010.96,215.75 1013.02,206.79" fill="#3568a3"/>
  <line x1="811.0" y1="220.0" x2="1011.00" y2="220.00" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="1019.00,220.00 1011.00,224.60 1011.00,215.40" fill="#3568a3"/>
  <line x1="810.2136533601836" y1="275.062049969143" x2="1011.99" y2="228.73" stroke="#3568a3" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="1019.79,226.94 1013.02,233.21 1010.96,224.25" fill="#3568a3"/>
  <circle cx="210" cy="220" r="22" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="210" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">S</text>
  <circle cx="490" cy="180" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="490" y="185" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">A</text>
  <circle cx="490" cy="262" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="490" y="267" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">B</text>
  <circle cx="780" cy="158" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="780" y="163" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">C</text>
  <circle cx="780" cy="220" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="780" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">D</text>
  <circle cx="780" cy="282" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="780" y="287" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">E</text>
  <circle cx="1050" cy="220" r="22" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="1050" y="225" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">T</text>
  <text x="620.0" y="352" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">第 0 层 1 个 / 第 1 层 2 个 / 第 2 层 3 个 / 第 3 层 1 个;入队顺序 S A B C D E T;最短步数 3</text>
  <rect x="30" y="398" width="1180" height="94" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="52" y="430" font-size="14" fill="#252b33" text-anchor="start" font-weight="600">模板一:不分层,visited 在入队时标记 —— 只能判断「能不能到达」</text>
  <text x="52" y="456" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">while q: cur = q.pop();出队顺序 S A B C D E T,一共出队 7 次</text>
  <text x="52" y="478" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">没有「层」的概念:step++ 只能写在出队那一行 → 数出来是 7,而正确答案是 3</text>
  <rect x="30" y="500" width="1180" height="94" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="52" y="532" font-size="14" fill="#252b33" text-anchor="start" font-weight="600">模板二:size = len(q) 先固化,for 吃掉一整层,while 末尾 step++(本文例题都用它)</text>
  <text x="52" y="558" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">step=0 处理 { S } → step=1 处理 { A, B } → step=2 处理 { C, D, E } → step=3 处理 { T },处理到 T 时返回 3</text>
  <text x="52" y="580" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">整个 while 只转 3 圈,step++ 只发生 3 次;和模板一的 7 次出队是两件事</text>
  <rect x="30" y="602" width="1180" height="94" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="52" y="634" font-size="14" fill="#252b33" text-anchor="start" font-weight="600">模板三:把步数存进队列元素里,(节点, 步数)</text>
  <text x="52" y="660" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">S,0 → A,1 → B,1 → C,2 → D,2 → E,2 → T,3:出队时就已经知道步数</text>
  <text x="52" y="682" font-size="12.5" fill="#737c88" text-anchor="start" font-weight="400">不需要分层循环,但每个元素多存一个整数;要记录具体路径时也用它</text>
</svg>
