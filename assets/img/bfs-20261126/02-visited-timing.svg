  <polygon points="1109.00,230.00 1101.00,234.60 1101.00,225.40" fill="#3568a3"/>
  <circle cx="170" cy="230" r="22" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="170" y="235" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">S</text>
  <circle cx="430" cy="160" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="430" y="165" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">A</text>
  <circle cx="430" cy="286" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="430" y="291" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">B</text>
  <circle cx="690" cy="160" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="690" y="165" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">C</text>
  <circle cx="690" cy="286" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="690" y="291" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">D</text>
  <circle cx="920" cy="230" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="920" y="235" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">E</text>
  <circle cx="1140" cy="230" r="22" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="1140" y="235" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">T</text>
  <text x="620.0" y="328" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">层:S | A B | C D | E | T;最短步数 4(S → A → C → E → T)</text>
  <rect x="30" y="360" width="580" height="330" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <rect x="52" y="384" width="8" height="22" rx="2" fill="#e4f1ee" stroke="#252b33" stroke-width="0"/>
  <text x="72" y="402" font-size="15" fill="#252b33" text-anchor="start" font-weight="600">入队时标记(正确)</text>
  <text x="72" y="442" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">每轮开头的队列快照:[S] → [A, B] → [C, D] → [E]</text>
  <text x="72" y="476" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">C 和 D 各有 2 个父亲,但入队时就已经标记了,第二个父亲看不见它们</text>
  <text x="72" y="510" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">每个节点恰好入队 1 次:总入队 7 次(节点共 7 个)</text>
  <text x="72" y="544" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">队列峰值 2 个(展开 S 之后,A、B 同时在队列里)</text>
  <text x="72" y="578" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">答案 4 步 —— 正确</text>
  <rect x="630" y="360" width="580" height="330" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <rect x="652" y="384" width="8" height="22" rx="2" fill="#fdf0e3" stroke="#252b33" stroke-width="0"/>
  <text x="672" y="402" font-size="15" fill="#252b33" text-anchor="start" font-weight="600">出队时标记(错)</text>
  <text x="672" y="442" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">出队序列:S A B C D C D E E E E T(一共出队 12 次)</text>
  <text x="672" y="476" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">C、D、E 都在出队时才被标记,于是被后来的父亲又入队一次</text>
  <text x="672" y="510" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">总入队 15 次,是正确版的 2.14 倍</text>
  <text x="672" y="544" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">队列峰值 4 个(C、D 各被塞了两份,同时躺在队列里)</text>
  <text x="672" y="578" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="400">答案仍是 4 步 —— 不崩只错,对答案发现不了</text>
  <text x="620.0" y="726" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">两个版本的答案都是 4 步、访问的节点数也一样;但总入队 7 vs 15、队列峰值 2 vs 4</text>
</svg>
