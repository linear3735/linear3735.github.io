  <text x="620" y="36" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">visited 在入队时标记 vs 在出队时标记:答案一样,队列差一倍</text>
  <text x="620" y="60" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">同一张图、同一个起点和终点;两个变体的入队次数与队列峰值都是这段代码真跑出来的</text>
  <rect x="30" y="84" width="1180" height="250" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
