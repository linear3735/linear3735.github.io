<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img">
  <rect width="1240" height="620" fill="#ffffff"/>
  <text x="620" y="36" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">双向 BFS:从 b^d 降到 2·b^(d/2),代价是要能从终点反向走</text>
  <text x="620" y="60" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">以 752 转盘锁为例(target=0202,含 5 个 deadends,b=8、d=6);两个出队数都是这段代码真跑出来的(集合按字典序迭代,数字每次跑都一样)</text>
  <rect x="30" y="84" width="580" height="400" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="320" y="122" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">单源:一层一层往外扩</text>
  <rect x="74" y="306.0" width="58" height="24.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="103.0" y="298.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="138" y="285.0" width="58" height="45.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="167.0" y="277.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <rect x="202" y="264.0" width="58" height="66.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="231.0" y="256.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">64</text>
  <rect x="266" y="243.0" width="58" height="87.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="295.0" y="235.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">512</text>
  <rect x="330" y="222.0" width="58" height="108.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="359.0" y="214.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">4096</text>
  <rect x="394" y="201.0" width="58" height="129.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="423.0" y="193.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">32768</text>
  <rect x="458" y="180.0" width="58" height="150.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="487.0" y="172.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">262144</text>
  <line x1="60" y1="330" x2="560" y2="330" stroke="#e7eaf0" stroke-width="1.6" stroke-linecap="round"/>
  <text x="320" y="366" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">第 0 层到第 6 层:总量 ≈ b^d = 262144</text>
  <text x="320" y="396" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">真实用例:单源出队 822 个节点</text>
  <text x="320" y="424" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">(理想模型不封顶;真实状态只有 10^4 个,所以不到 262144)</text>
  <text x="320" y="456" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">每层约 b^k 个:1 → 8 → 64 → 512 → … → 262144</text>
  <rect x="630" y="84" width="580" height="400" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="920" y="122" font-size="15" fill="#252b33" text-anchor="middle" font-weight="600">双向:两边各扩到 d/2 = 3 层就碰头</text>
  <rect x="660" y="306.0" width="44" height="24.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="682.0" y="298.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="709" y="264.0" width="44" height="66.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="731.0" y="256.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <rect x="758" y="222.0" width="44" height="108.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="780.0" y="214.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">64</text>
  <rect x="807" y="180.0" width="44" height="150.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="829.0" y="172.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">512</text>
  <rect x="1136" y="306.0" width="44" height="24.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="1158.0" y="298.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="1087" y="264.0" width="44" height="66.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="1109.0" y="256.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <rect x="1038" y="222.0" width="44" height="108.0" rx="3" fill="#e8eff7" stroke="#252b33" stroke-width="1.4"/>
  <text x="1060.0" y="214.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">64</text>
  <rect x="989" y="180.0" width="44" height="150.0" rx="3" fill="#eef1f5" stroke="#252b33" stroke-width="1.4"/>
  <text x="1011.0" y="172.0" font-size="11" fill="#252b33" text-anchor="middle" font-weight="400">512</text>
  <line x1="650" y1="330" x2="1190" y2="330" stroke="#e7eaf0" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="920" y1="190" x2="920" y2="330" stroke="#b5762a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="920" y="182" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">碰头</text>
  <text x="920" y="366" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">两边各 ≈ b^(d/2) = 512,合起来 ≈ 1024</text>
  <text x="920" y="396" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">真实用例:双向出队 45 个节点</text>
  <text x="920" y="424" font-size="11.5" fill="#737c88" text-anchor="middle" font-weight="400">起点一侧 + 终点一侧,两边都不必走完整条路</text>
  <text x="920" y="456" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">每次扩散更小的那一侧(这个用例真的交换了 4 次)</text>
  <text x="620.0" y="528" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">实测:822 / 45 ≈ 18.3 倍(同一步数 6);理想模型里 b^d 与 2·b^(d/2) 是 262144 / 1024</text>
  <text x="620.0" y="558" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">「每次扩散更小的那一侧」不影响正确性,只影响快慢:不交换也能算出 6 步,但出队 351 个节点,比交换版多 306 个</text>
</svg>
