<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">十大排序算法的三个族</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">分族的依据不是代码长短，而是「比较的下界」和「是否依赖比较」</text>
  <rect x="30" y="88" width="310" height="54" rx="7" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="185.0" y="120.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">平方级 O(n²)</text>
  <text x="42" y="162" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">靠反复比较与交换，实现最直白</text>
  <rect x="30" y="178" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="185.0" y="201.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">冒泡排序</text>
  <rect x="30" y="224" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="185.0" y="247.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">选择排序</text>
  <rect x="30" y="270" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="185.0" y="293.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">插入排序</text>
  <rect x="30" y="316" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="185.0" y="339.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">希尔排序*</text>
  <rect x="345" y="88" width="310" height="54" rx="7" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="500.0" y="120.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">O(n log n) 比较排序</text>
  <text x="357" y="162" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">靠分治或堆结构把比较次数压到下界</text>
  <rect x="345" y="178" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="500.0" y="201.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">归并排序</text>
  <rect x="345" y="224" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="500.0" y="247.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">快速排序</text>
  <rect x="345" y="270" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="500.0" y="293.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">堆排序</text>
  <rect x="660" y="88" width="310" height="54" rx="7" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="815.0" y="120.4" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">非比较排序 O(n+k)</text>
  <text x="672" y="162" font-size="11" fill="#737c88" text-anchor="start" font-weight="400">不比较元素大小，靠值域直接定位</text>
  <rect x="660" y="178" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="815.0" y="201.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">计数排序</text>
  <rect x="660" y="224" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="815.0" y="247.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">桶排序</text>
  <rect x="660" y="270" width="310" height="38" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="815.0" y="293.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">基数排序</text>
  <rect x="30" y="372" width="940" height="74" rx="9" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1"/>
  <text x="46" y="400" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">* 稳定性没有统一的族规律：只有「相等元素不跨越彼此」的实现才稳定。</text>
  <text x="46" y="424" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">稳定的：冒泡、插入、归并、计数、桶、基数；希尔、选择、快排、堆排都不稳定。</text>
</svg>
