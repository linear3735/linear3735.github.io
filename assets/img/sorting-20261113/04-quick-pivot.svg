<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">枢轴选得好不好,决定快排退化成什么</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">三种划分策略在「已经有序」的输入上表现完全不同</text>
  <rect x="30" y="96" width="190" height="84" rx="7" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="125.0" y="143.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">固定取首元素</text>
  <text x="246" y="126" font-size="13.5" fill="#b5762a" text-anchor="start" font-weight="400">1 | 2 3 4 5 6 7 8</text>
  <text x="246" y="156" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">每次只切掉 1 个 → 递归 n 层 → O(n²)</text>
  <rect x="30" y="200" width="190" height="84" rx="7" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="125.0" y="247.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">随机选枢轴</text>
  <text x="246" y="230" font-size="13.5" fill="#3568a3" text-anchor="start" font-weight="400">1 2 3 | 4 | 5 6 7 8</text>
  <text x="246" y="260" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">期望对半分 → 期望 O(n log n)，与输入顺序无关</text>
  <rect x="30" y="304" width="190" height="84" rx="7" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="125.0" y="351.04" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">三路划分</text>
  <text x="246" y="334" font-size="13.5" fill="#2f7d6d" text-anchor="start" font-weight="400">[1 1 1] | 2 2 | [3 3 3]</text>
  <text x="246" y="364" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">相等元素一次清空，重复多的输入反而更快</text>
  <text x="30" y="410" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">注意：「随机枢轴」是期望 O(n log n)，不是最坏——理论上仍然存在 O(n²) 的输入，只是概率极低。</text>
</svg>
