<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">归并时相等取左边,稳定性就是这么保住的</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">两个已排好序的半区合并，比较只看「谁更小」，相等时必须优先取左</text>
  <text x="158" y="126" font-size="12.5" fill="#737c88" text-anchor="end" font-weight="400">左半区</text>
  <rect x="172" y="96" width="106" height="46" rx="6" fill="#e8eff7" stroke="#252b33" stroke-width="1.3"/>
  <text x="225" y="120" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="225" y="135" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">原下标 0</text>
  <rect x="290" y="96" width="106" height="46" rx="6" fill="#e8eff7" stroke="#252b33" stroke-width="1.3"/>
  <text x="343" y="120" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="343" y="135" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">原下标 2</text>
  <text x="158" y="226" font-size="12.5" fill="#737c88" text-anchor="end" font-weight="400">右半区</text>
  <rect x="172" y="196" width="106" height="46" rx="6" fill="#e4f1ee" stroke="#252b33" stroke-width="1.3"/>
  <text x="225" y="220" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="225" y="235" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">原下标 4</text>
  <rect x="290" y="196" width="106" height="46" rx="6" fill="#e4f1ee" stroke="#252b33" stroke-width="1.3"/>
  <text x="343" y="220" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <text x="343" y="235" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">原下标 6</text>
  <text x="452" y="250" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">两个 5 相等：必须取左半区那个（原下标 2），</text>
  <text x="452" y="272" font-size="12.5" fill="#b5762a" text-anchor="start" font-weight="400">取右边就会让原下标 4 排到 2 前面，稳定性立刻丢失。</text>
  <rect x="172" y="300" width="106" height="46" rx="6" fill="#e8eff7" stroke="#252b33" stroke-width="1.3"/>
  <text x="225" y="328" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="290" y="300" width="106" height="46" rx="6" fill="#e8eff7" stroke="#252b33" stroke-width="1.3"/>
  <text x="343" y="328" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="343" y="343" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">← 左</text>
  <rect x="408" y="300" width="106" height="46" rx="6" fill="#e4f1ee" stroke="#252b33" stroke-width="1.3"/>
  <text x="461" y="328" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <text x="461" y="343" font-size="10" fill="#737c88" text-anchor="middle" font-weight="400">右</text>
  <rect x="526" y="300" width="106" height="46" rx="6" fill="#e4f1ee" stroke="#252b33" stroke-width="1.3"/>
  <text x="579" y="328" font-size="15" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <text x="158" y="330" font-size="12.5" fill="#737c88" text-anchor="end" font-weight="400">合并结果</text>
</svg>
