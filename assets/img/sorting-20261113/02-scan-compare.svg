  <text x="549.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="600" y="96" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="639.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="690" y="96" width="78" height="46" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="729.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <rect x="780" y="96" width="78" height="46" rx="7" fill="#ffffff" stroke="#252b33" stroke-width="1.4"/>
  <text x="819.0" y="124.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <text x="134" y="126" font-size="12.5" fill="#737c88" text-anchor="end" font-weight="400">冒泡 第2趟</text>
  <text x="735.0" y="84" font-size="11" fill="#2f7d6d" text-anchor="middle" font-weight="400">8、9 已就位(第1趟的成果)</text>
  <text x="420" y="172" font-size="11.5" fill="#b5762a" text-anchor="middle" font-weight="400">本趟仍要把 [0, 5] 整段扫完：6 个格子，一个都不能跳</text>
  <rect x="150" y="258" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="189.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <rect x="240" y="258" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="279.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <rect x="330" y="258" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="369.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <rect x="420" y="258" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="459.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <rect x="510" y="258" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="549.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="600" y="258" width="78" height="46" rx="7" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="639.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
