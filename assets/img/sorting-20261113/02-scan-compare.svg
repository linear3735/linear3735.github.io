  <text x="819.0" y="286.76" font-size="16" fill="#252b33" text-anchor="middle" font-weight="400">9</text>
  <text x="134" y="288" font-size="12.5" fill="#737c88" text-anchor="end" font-weight="400">插入 处理第6个</text>
  <rect x="600" y="336" width="78" height="40" rx="7" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="639.0" y="360.68" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">key=4</text>
  <text x="639.0" y="396" font-size="11.5" fill="#2f7d6d" text-anchor="middle" font-weight="400">向左只看一格：3 &lt; 4，立刻停</text>
  <line x1="639.0" y1="332" x2="535.94" y2="319.00" stroke="#2f7d6d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <polygon points="528.00,318.00 536.51,314.44 535.36,323.56" fill="#2f7d6d"/>
