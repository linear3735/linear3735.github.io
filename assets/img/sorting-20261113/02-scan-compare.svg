<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img">
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">冒泡每趟扫到底,插入一遇到更小就停</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">两者的扫描区间宽度不同，这是 O(n²) 常数项差异的来源</text>
