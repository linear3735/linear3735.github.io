<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="34" y="40" font-size="18" fill="#252b33" text-anchor="start" font-weight="600">建堆为什么是 O(n) 而不是 O(n log n)</text>
  <text x="34" y="63" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">自底向上建堆的总代价是「每层节点数 × 该层高度」，再被几何级数压成常数</text>
  <text x="90" y="82" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">层 d</text>
  <text x="300" y="82" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">该层节点数 2^d</text>
  <text x="560" y="82" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">每个节点最多下沉 h−d</text>
  <text x="810" y="82" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">该层总代价</text>
  <rect x="130" y="92" width="740" height="42" rx="5" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1"/>
  <text x="90" y="120" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="300" y="120" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="560" y="120" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="810" y="120" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="130" y="140" width="740" height="42" rx="5" fill="#ffffff" stroke="#e7eaf0" stroke-width="1"/>
  <text x="90" y="168" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="300" y="168" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="560" y="168" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="810" y="168" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">6</text>
  <rect x="130" y="188" width="740" height="42" rx="5" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1"/>
  <text x="90" y="216" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="300" y="216" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="560" y="216" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <text x="810" y="216" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <rect x="130" y="236" width="740" height="42" rx="5" fill="#ffffff" stroke="#e7eaf0" stroke-width="1"/>
  <text x="90" y="264" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="300" y="264" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <text x="560" y="264" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <text x="810" y="264" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">8</text>
  <rect x="130" y="284" width="740" height="42" rx="5" fill="#e8eff7" stroke="#e7eaf0" stroke-width="1"/>
  <text x="90" y="312" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <text x="300" y="312" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">16</text>
  <text x="560" y="312" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <text x="810" y="312" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="130" y="340" width="740" height="46" rx="6" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1"/>
  <text x="470" y="370" font-size="15" fill="#2f7d6d" text-anchor="middle" font-weight="400">合计 = 2^(h+1) − h − 2  &lt;  2n</text>
  <text x="30" y="432" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">关键：下沉代价大的层节点少，节点多的层下沉代价小 —— 上重下轻，求和收敛到常数倍 n。</text>
</svg>
