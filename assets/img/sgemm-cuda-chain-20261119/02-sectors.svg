<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img">
  <rect width="1180" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="1180" height="620" rx="0" fill="#ffffff" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="40" y="44" font-size="19" fill="#252b33" text-anchor="start" font-weight="700">同样是 32 个线程,访存代价差了 7 倍多</text>
  <text x="40" y="70" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">每格 = 一个 32 字节 sector。填色格 = 这个 warp 真正用掉的事务,灰格 = 没用到的。kernel 1 合计 65 格,kernel 2 合计 9 格</text>
  <rect x="40" y="92" width="540" height="386" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="310.0" y="116" font-size="13.5" fill="#252b33" text-anchor="middle" font-weight="600">kernel 1  朴素版  blockDim(32, 32)</text>
  <text x="60" y="140" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="700">A[x*K + i]</text>
  <text x="560" y="140" font-size="12.5" fill="#b5762a" text-anchor="end" font-weight="700">32 / 48 格</text>
  <rect x="60.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="122.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="184.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="246.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="308.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="370.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="432.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="494.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <text x="60" y="198" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">warp 内 x 连续 -&gt; 32 个地址散在 32 行,各占一个 sector</text>
  <text x="60" y="256" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="700">B[i*N + y]</text>
  <text x="560" y="256" font-size="12.5" fill="#2f7d6d" text-anchor="end" font-weight="700">1 / 48 格</text>
  <rect x="60.0" y="268" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="122.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
