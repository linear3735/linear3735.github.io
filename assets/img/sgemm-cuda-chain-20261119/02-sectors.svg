  <rect x="246.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="308.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="370.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="432.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="494.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <text x="60" y="314" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">y 恒定 -&gt; 广播,32 个线程读同一个地址</text>
  <text x="60" y="372" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="700">C[x*N + y]</text>
  <text x="560" y="372" font-size="12.5" fill="#b5762a" text-anchor="end" font-weight="700">32 / 48 格</text>
  <rect x="60.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="122.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="184.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="246.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="308.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="370.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="432.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="494.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <text x="60" y="430" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">跨行写,步长 N,每行只碰 1 个 float</text>
  <rect x="640" y="92" width="540" height="386" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="910.0" y="116" font-size="13.5" fill="#252b33" text-anchor="middle" font-weight="600">kernel 2  合并版  blockDim(1024)</text>
  <text x="660" y="140" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="700">A[cRow*K + i]</text>
  <text x="1160" y="140" font-size="12.5" fill="#2f7d6d" text-anchor="end" font-weight="700">1 / 48 格</text>
  <rect x="660.0" y="152" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="722.0" y="152" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
