  <rect x="970.0" y="152" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="1032.0" y="152" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="1094.0" y="152" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <text x="660" y="198" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">cRow 恒定 -&gt; 也是广播,与 kernel 1 正好相反</text>
  <text x="660" y="256" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="700">B[i*N + cCol]</text>
  <text x="1160" y="256" font-size="12.5" fill="#2f7d6d" text-anchor="end" font-weight="700">4 / 48 格</text>
  <rect x="660.0" y="268" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="722.0" y="268" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="784.0" y="268" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="846.0" y="268" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="908.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="970.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="1032.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="1094.0" y="268" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <text x="660" y="314" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">cCol 连续 -&gt; 32 个 float 挤进 4 个 sector</text>
  <text x="660" y="372" font-size="12.5" fill="#252b33" text-anchor="start" font-weight="700">C[cRow*N + cCol]</text>
  <text x="1160" y="372" font-size="12.5" fill="#2f7d6d" text-anchor="end" font-weight="700">4 / 48 格</text>
  <rect x="660.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="722.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="784.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="846.0" y="384" width="56.0" height="22.0" rx="3" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.0"/>
  <rect x="908.0" y="384" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
