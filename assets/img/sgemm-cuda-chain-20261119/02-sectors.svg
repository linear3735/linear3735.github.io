  <rect x="1032.0" y="384" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <rect x="1094.0" y="384" width="56.0" height="22.0" rx="3" fill="#eef1f5" stroke="#e7eaf0" stroke-width="0.8"/>
  <text x="660" y="430" font-size="11" fill="#252b33" text-anchor="start" font-weight="400">连续写,同样合并成 4 个 sector</text>
  <line x1="40" y1="486" x2="1140" y2="486" stroke="#e7eaf0" stroke-width="1.0" stroke-linecap="round"/>
  <text x="40" y="512" font-size="13" fill="#252b33" text-anchor="start" font-weight="600">kernel 1: A 与 C 各 32 格,B 是广播只占 1 格 —— 合计 65 格</text>
  <text x="40" y="538" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="600">kernel 2: A 变成广播(1 格),B 与 C 各 4 格 —— 合计 9 格,是 kernel 1 的 7.2 分之一</text>
  <text x="40" y="564" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">换的只是线程到元素的映射,算法一行没动。README 里这一步是 309.0 -&gt; 1986.5 GFLOPs</text>
  <text x="40" y="588" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">所以那 6.4 倍来自访存,不是来自算得更快 —— 每条线程做的乘加次数完全没变</text>
</svg>
