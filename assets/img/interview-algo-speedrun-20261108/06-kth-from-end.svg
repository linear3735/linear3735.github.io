<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="36" font-size="18" fill="#252b33" text-anchor="middle" font-weight="600">倒数第 k 个节点:让 p1 先走 k 步</text>
  <circle cx="108" cy="170" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="102" y="175" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <line x1="112" y1="161" x2="112" y2="179" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="132" y1="170" x2="152.00" y2="170.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="160.00,170.00 152.00,174.60 152.00,165.40" fill="#737c88"/>
  <circle cx="184" cy="170" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="178" y="175" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <line x1="188" y1="161" x2="188" y2="179" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="208" y1="170" x2="228.00" y2="170.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="236.00,170.00 228.00,174.60 228.00,165.40" fill="#737c88"/>
  <circle cx="260" cy="170" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="254" y="175" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <line x1="264" y1="161" x2="264" y2="179" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="284" y1="170" x2="304.00" y2="170.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="312.00,170.00 304.00,174.60 304.00,165.40" fill="#737c88"/>
  <circle cx="336" cy="170" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="330" y="175" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <line x1="340" y1="161" x2="340" y2="179" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="360" y1="170" x2="380.00" y2="170.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="388.00,170.00 380.00,174.60 380.00,165.40" fill="#737c88"/>
  <circle cx="412" cy="170" r="22" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="406" y="175" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">5</text>
  <line x1="416" y1="161" x2="416" y2="179" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <text x="260" y="126" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="400">p1</text>
  <line x1="260" y1="138" x2="260.00" y2="136.00" stroke="#3568a3" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="260.00,144.00 255.40,136.00 264.60,136.00" fill="#3568a3"/>
  <text x="108" y="232" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="400">p2</text>
  <line x1="108" y1="220" x2="108.00" y2="204.00" stroke="#b5762a" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="108.00,196.00 112.60,204.00 103.40,204.00" fill="#b5762a"/>
  <text x="184" y="100" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">p1 先走 k 步</text>
  <line x1="130" y1="86" x2="238" y2="86" stroke="#3568a3" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="130" y1="80" x2="130" y2="92" stroke="#3568a3" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="238" y1="80" x2="238" y2="92" stroke="#3568a3" stroke-width="1.2" stroke-linecap="round"/>
  <text x="474" y="175" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">null</text>
  <line x1="436" y1="170" x2="468" y2="170" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <text x="480" y="286" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">当 p1 走到 null 时,它一共走了 n − k 步;</text>
  <text x="480" y="308" font-size="12" fill="#252b33" text-anchor="middle" font-weight="400">p2 从 head 同步走了 n − k 步,正好停在倒数第 k 个节点。</text>
  <text x="480" y="340" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">想删它?先找倒数第 k+1 个 —— 所以 dummy 又出现了</text>
</svg>
