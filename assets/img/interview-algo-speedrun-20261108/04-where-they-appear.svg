<svg xmlns="http://www.w3.org/2000/svg" width="940" height="320" viewBox="0 0 940 320" role="img">
  <rect width="940" height="320" fill="#ffffff"/>
  <text x="470" y="36" font-size="18" fill="#252b33" text-anchor="middle" font-weight="600">这两种结构在算法题里出现在哪</text>
  <rect x="32" y="62" width="292" height="216" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="178.0" y="92" font-size="14" fill="#3568a3" text-anchor="middle" font-weight="600">栈 Stack</text>
  <circle cx="58" cy="122" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="72" y="126" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">括号匹配 / 表达式求值</text>
  <circle cx="58" cy="158" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="72" y="162" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">单调栈:下一个更大元素</text>
  <circle cx="58" cy="194" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="72" y="198" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">DFS 的显式栈实现</text>
  <circle cx="58" cy="230" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="72" y="234" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">二叉树非递归遍历</text>
  <rect x="332" y="62" width="292" height="216" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="478.0" y="92" font-size="14" fill="#3568a3" text-anchor="middle" font-weight="600">队列 Queue</text>
  <circle cx="358" cy="122" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="372" y="126" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">BFS 层序遍历</text>
  <circle cx="358" cy="158" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="372" y="162" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">滑动窗口最大值(单调队列)</text>
  <circle cx="358" cy="194" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="372" y="198" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">两个栈实现队列</text>
  <circle cx="358" cy="230" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="372" y="234" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">任务 / 事件调度</text>
  <rect x="632" y="62" width="292" height="216" rx="10" fill="#f3f5f7" stroke="#e7eaf0" stroke-width="1.2"/>
  <text x="778.0" y="92" font-size="14" fill="#3568a3" text-anchor="middle" font-weight="600">优先队列(堆)</text>
  <circle cx="658" cy="122" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="672" y="126" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">合并 k 个有序链表 ← 本文用到</text>
  <circle cx="658" cy="158" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="672" y="162" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">Top-K / 第 K 大</text>
  <circle cx="658" cy="194" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="672" y="198" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">Dijkstra 最短路</text>
  <circle cx="658" cy="230" r="3" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="672" y="234" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">注意:它的 pop 是 O(log n)</text>
  <text x="470" y="304" font-size="11" fill="#737c88" text-anchor="middle" font-weight="400">第三列是个提醒:优先队列的底层是二叉堆,它不满足 O(1) 的进出</text>
</svg>
