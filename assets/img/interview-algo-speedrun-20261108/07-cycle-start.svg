<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img">
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="36" font-size="18" fill="#252b33" text-anchor="middle" font-weight="600">快慢指针:判断有环容易,找环起点要靠一点代数</text>
  <circle cx="96" cy="250" r="21" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="90" y="255" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">1</text>
  <line x1="100" y1="241" x2="100" y2="259" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="119" y1="250" x2="139.00" y2="250.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="147.00,250.00 139.00,254.60 139.00,245.40" fill="#737c88"/>
  <circle cx="170" cy="250" r="21" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="164" y="255" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">2</text>
  <line x1="174" y1="241" x2="174" y2="259" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="193" y1="250" x2="213.00" y2="250.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="221.00,250.00 213.00,254.60 213.00,245.40" fill="#737c88"/>
  <circle cx="244" cy="250" r="21" fill="#e8eff7" stroke="#252b33" stroke-width="1.5"/>
  <text x="238" y="255" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <line x1="248" y1="241" x2="248" y2="259" stroke="#737c88" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="96" y1="206" x2="96.00" y2="217.00" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="96.00,225.00 91.40,217.00 100.60,217.00" fill="#737c88"/>
  <text x="96" y="194" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">head</text>
  <circle cx="502" cy="242" r="21" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.6"/>
  <text x="502" y="247" font-size="13" fill="#252b33" text-anchor="middle" font-weight="400">C</text>
  <line x1="267" y1="250" x2="471.00" y2="248.08" stroke="#737c88" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="479.00,248.00 471.04,252.68 470.96,243.48" fill="#737c88"/>
  <circle cx="590" cy="250" r="88" fill="none" stroke="#3568a3" stroke-width="2.6"/>
  <text x="496" y="168" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="400">环</text>
  <text x="299.0" y="284" font-size="13" fill="#b5762a" text-anchor="middle" font-weight="400">x</text>
  <text x="470.91298619618334" y="286.5072227327473" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">y</text>
  <text x="695.4165548153419" y="199.26718473191005" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">z</text>
  <circle cx="544.003523854102" cy="174.97784205876349" r="5.5" fill="#3568a3" stroke="#3568a3" stroke-width="1.4"/>
  <text x="534.003523854102" y="158.97784205876349" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">相遇点</text>
  <text x="60" y="372" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">设 slow 走了 k 步,则 fast 走了 2k 步;</text>
  <text x="60" y="394" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">fast 多走的 k 步正好是环长的整数倍。</text>
  <text x="60" y="416" font-size="12" fill="#3568a3" text-anchor="start" font-weight="400">于是相遇后把任一指针放回 head,同速再走,必在 C 相遇。</text>
</svg>
