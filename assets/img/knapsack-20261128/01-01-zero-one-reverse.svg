<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img">
  <rect width="1240" height="560" fill="#ffffff"/>
  <text x="620" y="38" font-size="17" fill="#252b33" text-anchor="middle" font-weight="600">0-1 背包压成一维:dp[w] 读的是左边的 dp[w-wt]</text>
  <text x="620" y="62" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">例子:已经装过 wt=2,val=3 这件,现在轮到 wt=3,val=4;读的是 dp[2]</text>
  <text x="106.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=0</text>
  <text x="238.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=1</text>
  <text x="370.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=2</text>
  <text x="502.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=3</text>
  <text x="634.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=4</text>
  <text x="766.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=5</text>
  <text x="898.0" y="128" font-size="12" fill="#737c88" text-anchor="middle" font-weight="400">w=6</text>
  <text x="40" y="104" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="600">上一行的旧值(只装过 wt=2,val=3)</text>
  <rect x="40" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="106.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="172" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="238.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="304" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="370.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="436" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="502.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="568" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="634.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="700" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="766.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="832" y="150" width="132" height="62" rx="4" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="898.0" y="186.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <text x="40" y="360" font-size="12" fill="#b5762a" text-anchor="start" font-weight="600">本行更新后(再加上 wt=3,val=4)</text>
  <rect x="40" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="106.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="172" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="238.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">0</text>
  <rect x="304" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="370.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">3</text>
  <rect x="436" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="502.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="568" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="634.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">4</text>
  <rect x="700" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="766.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <rect x="832" y="274" width="132" height="62" rx="4" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="898.0" y="310.0" font-size="14" fill="#252b33" text-anchor="middle" font-weight="400">7</text>
  <path d="M 370.0 212 V 243.0 H 766.0 V 272.0" fill="none" stroke="#3568a3" stroke-width="2" stroke-linejoin="round"/>
  <line x1="766.0" y1="243.0" x2="766.00" y2="264.00" stroke="#3568a3" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="766.00,272.00 761.40,264.00 770.60,264.00" fill="#3568a3"/>
  <text x="191.79999999999998" y="270.0" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">dp[5] 读 dp[5−3]=dp[2]=3，3+4=7</text>
  <text x="620" y="388" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">遍历方向决定读到的是哪一行</text>
  <rect x="40" y="408" width="540" height="58" rx="8" fill="#fdf0e3" stroke="#b5762a" stroke-width="1.4"/>
  <text x="310" y="432" font-size="14" fill="#b5762a" text-anchor="middle" font-weight="600">从小到大 ✗</text>
  <text x="310" y="454" font-size="11.5" fill="#252b33" text-anchor="middle" font-weight="400">处理 w=5 时 dp[2] 已被本轮改写 → 读到本行，多算一件</text>
  <rect x="660" y="408" width="540" height="58" rx="8" fill="#e4f1ee" stroke="#2f7d6d" stroke-width="1.4"/>
  <text x="930" y="432" font-size="14" fill="#2f7d6d" text-anchor="middle" font-weight="600">从大到小 ✓</text>
  <text x="930" y="454" font-size="11.5" fill="#252b33" text-anchor="middle" font-weight="400">处理 w=5 时 dp[2] 还没被碰过 → 读到上一行，正好两件都装</text>
</svg>
