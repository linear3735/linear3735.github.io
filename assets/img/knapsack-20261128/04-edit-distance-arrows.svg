  <text x="856" y="479" font-size="13" fill="#b5762a" text-anchor="start" font-weight="600">替换:s1[i]→s2[j]</text>
  <text x="856" y="500" font-size="11.5" fill="#737c88" text-anchor="start" font-weight="400">看左上 dp[i-1][j-1] + 1</text>
  <rect x="70" y="540" width="1100" height="54" rx="8" fill="#e8eff7" stroke="#3568a3" stroke-width="1.4"/>
  <text x="620" y="562" font-size="13" fill="#3568a3" text-anchor="middle" font-weight="400">s1[3]=='t' 与 s2[3]=='t' 相等 → 直接继承左上 dp[2][2]=1，不加代价</text>
  <text x="620" y="583" font-size="12" fill="#3568a3" text-anchor="middle" font-weight="400">写反左右两次的代价还可以互换，只有长度差很大时才露馅</text>
