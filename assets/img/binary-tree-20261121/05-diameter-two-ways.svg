<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img">
  <rect width="1080" height="440" fill="#ffffff"/>
  <text x="36" y="40" font-size="17" fill="#252b33" text-anchor="start" font-weight="600">为什么「递归里套递归」是危险信号:一条 5 节点的链,深度被重算了 10 次</text>
  <text x="36" y="76" font-size="13" fill="#b5762a" text-anchor="start" font-weight="600">朴素版:每个节点都重新算一遍左右子树的深度</text>
  <line x1="170.0" y1="134" x2="170.0" y2="152" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="170.0" y1="188" x2="170.0" y2="206" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="170.0" y1="242" x2="170.0" y2="260" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="170.0" y1="296" x2="170.0" y2="314" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="170.0" cy="116" r="18" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="170.0" y="121" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="170.0" cy="170" r="18" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="170.0" y="175" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="170.0" cy="224" r="18" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="170.0" y="229" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="170.0" cy="278" r="18" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="170.0" y="283" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <circle cx="170.0" cy="332" r="18" fill="#fdf0e3" stroke="#252b33" stroke-width="1.4"/>
  <text x="170.0" y="337" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">5</text>
  <text x="214.0" y="174" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">×1</text>
  <text x="214.0" y="228" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">×2</text>
  <text x="214.0" y="282" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">×3</text>
  <text x="214.0" y="336" font-size="12" fill="#b5762a" text-anchor="middle" font-weight="600">×4</text>
  <text x="36" y="380" font-size="12" fill="#b5762a" text-anchor="start" font-weight="400">节点 5 的深度被算了 4 次</text>
  <text x="36" y="400" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">n 个节点共 1+2+…+(n−1) = n(n−1)/2 次 → O(N²)</text>
  <text x="560" y="76" font-size="13" fill="#2f7d6d" text-anchor="start" font-weight="600">后序版:一趟递归,在后序位置顺便算直径</text>
  <line x1="710.0" y1="134" x2="710.0" y2="152" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="710.0" y1="188" x2="710.0" y2="206" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="710.0" y1="242" x2="710.0" y2="260" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="710.0" y1="296" x2="710.0" y2="314" stroke="#737c88" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="710.0" cy="116" r="18" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="710.0" y="121" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">1</text>
  <circle cx="710.0" cy="170" r="18" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="710.0" y="175" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">2</text>
  <circle cx="710.0" cy="224" r="18" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="710.0" y="229" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">3</text>
  <circle cx="710.0" cy="278" r="18" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="710.0" y="283" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">4</text>
  <circle cx="710.0" cy="332" r="18" fill="#e4f1ee" stroke="#252b33" stroke-width="1.4"/>
  <text x="710.0" y="337" font-size="14" fill="#252b33" text-anchor="middle" font-weight="600">5</text>
  <text x="754.0" y="120" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">×1</text>
  <text x="754.0" y="174" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">×1</text>
  <text x="754.0" y="228" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">×1</text>
  <text x="754.0" y="282" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">×1</text>
  <text x="754.0" y="336" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="600">×1</text>
  <text x="560" y="380" font-size="12" fill="#2f7d6d" text-anchor="start" font-weight="400">每个节点的深度只算 1 次</text>
  <text x="560" y="400" font-size="12" fill="#252b33" text-anchor="start" font-weight="400">n 个节点共 n 次 → O(N)</text>
  <line x1="470" y1="220" x2="512.00" y2="220.00" stroke="#737c88" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="520.00,220.00 512.00,224.60 512.00,215.40" fill="#737c88"/>
  <text x="36" y="428" font-size="12" fill="#737c88" text-anchor="start" font-weight="400">两边的代码只差一件事:算直径的那一行,是写在「另一个递归函数」里,还是写在本函数的后序位置。</text>
</svg>
